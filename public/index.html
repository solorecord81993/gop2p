<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f2eb">
<title>Go Battle Live — หมากล้อมออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/go-engine.js"></script>
<script src="/i18n.js"></script>
<style>
:root{
  --sumi:#161311; --sumi-2:#211C18; --sumi-3:#2C2621; --line:#3A322B;
  --kaya:#E2B565; --shell:#F6F2E7; --shu:#C2372E; --shu-soft:#8E251E;
  --matcha:#7E9468; --muted:#9A8E82;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--sumi); color:var(--shell);
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif; font-size:16px;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
#app{max-width:520px; margin:0 auto; min-height:100%;
     padding:12px 14px calc(14px + var(--safe-b)); display:flex; flex-direction:column; gap:11px}
h1,h2,h3,.dp{font-family:'Mitr',sans-serif; font-weight:500}

.card{background:var(--sumi-2); border:1px solid var(--line); border-radius:14px; padding:15px}
.row{display:flex; gap:9px; align-items:center}
.grow{flex:1}
.hint{font-size:.8rem; color:var(--muted); line-height:1.65}
.err{color:#E8877E; font-size:.85rem; min-height:1.2em}
.hidden{display:none !important}

label{display:block; font-size:.8rem; color:var(--muted); margin-bottom:5px}
input,select{width:100%; background:var(--sumi-3); border:1px solid var(--line); color:var(--shell);
  border-radius:10px; padding:12px; font:inherit; font-size:1rem}
input:focus,select:focus{outline:2px solid var(--shu); outline-offset:1px}

button{font:inherit; font-family:'Mitr',sans-serif; font-weight:500; cursor:pointer; border:none;
  border-radius:11px; padding:13px 16px; transition:transform .07s, filter .15s; color:var(--shell)}
button:active:not(:disabled){transform:scale(.975)}
button:disabled{opacity:.35; cursor:not-allowed}
.btn-main{background:var(--shu); color:#fff}
.btn-ghost{background:var(--sumi-3); border:1px solid var(--line)}
.btn-wide{width:100%}
.btn-sm{padding:9px 13px; font-size:.85rem; border-radius:9px}

.seal{display:inline-grid; place-items:center; width:36px; height:36px; border-radius:6px; flex:none;
  background:var(--shu); color:#fff; font-family:'Mitr'; font-size:1.1rem;
  box-shadow:inset 0 0 0 1px var(--shu-soft)}

.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{background:var(--sumi-3); border:1px solid var(--line); border-radius:999px;
  padding:9px 14px; font-size:.87rem; cursor:pointer; user-select:none}
.chip.on{background:var(--shu); border-color:var(--shu); color:#fff}

.pcard{display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:12px;
  background:var(--sumi-2); border:1px solid var(--line); border-left:3px solid transparent;
  transition:border-color .2s, background .2s}
.pcard.turn{border-left-color:var(--shu); background:#271F1B}
.pcard.me{box-shadow:inset 0 0 0 1px #4A4038}
.dot{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.dot.b{background:radial-gradient(circle at 32% 30%, #57504A, #16130F)}
.dot.w{background:radial-gradient(circle at 32% 30%, #FFFEF8, #CFC7B2)}
.pname{font-weight:600; font-size:.97rem; line-height:1.25}
.psub{font-size:.75rem; color:var(--muted)}
.clock{font-family:'Mitr'; font-size:1.25rem; font-variant-numeric:tabular-nums; text-align:right; line-height:1.1}
.clock.warn{color:var(--shu)}
.clock.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}

.boardwrap{position:relative}
canvas{width:100%; height:auto; display:block; border-radius:12px; touch-action:none;
  box-shadow:0 6px 22px rgba(0,0,0,.45)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.status{background:var(--sumi-3); border-left:3px solid var(--shu); padding:11px 13px;
  border-radius:0 10px 10px 0; font-size:.88rem; line-height:1.6}
.status.calm{border-left-color:var(--matcha)}

.bar{position:sticky; bottom:0; background:linear-gradient(transparent, var(--sumi) 22%);
  padding-top:12px; display:flex; gap:9px}
.toast{position:fixed; left:50%; bottom:calc(22px + var(--safe-b)); transform:translateX(-50%);
  background:#3A322B; padding:11px 18px; border-radius:11px; font-size:.9rem; z-index:60;
  max-width:88vw; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.5)}
.onair{background:var(--shu); color:#fff; font-size:.7rem; padding:3px 9px; border-radius:999px;
  font-family:'Mitr'; letter-spacing:.05em}
.fade{animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
<link rel="stylesheet" href="/ui-light.css">
</head>
<body>
<div id="app">

<!-- ═══════════ 1. เข้าสู่ระบบ ═══════════ -->
<section id="scAuth" class="fade">
  <div class="row" style="margin-bottom:14px">
    <img class="brand-logo" src="/logo.svg" alt="Go Live">
    <div>
      <h1 style="font-size:1.25rem;line-height:1.2">Go Battle Live</h1>
      <div class="hint" data-i18n="app.tagline"></div>
    </div>
    <button class="btn-ghost btn-sm lang-toggle" type="button" aria-label="Language">TH</button>
  </div>

  <div class="card">
    <div class="chips" style="margin-bottom:15px">
      <div class="chip on" data-tab="login" data-i18n="auth.login"></div>
      <div class="chip" data-tab="signup" data-i18n="auth.signup"></div>
    </div>

    <div id="tabLogin">
      <label data-i18n="auth.username"></label>
      <input id="liUser" autocomplete="username" autocapitalize="none" spellcheck="false"
             maxlength="20" data-i18n-ph="auth.usernamePh">
      <div style="height:11px"></div>
      <label data-i18n="auth.password"></label>
      <input id="liPass" type="password" autocomplete="current-password">
      <div style="height:15px"></div>
      <button class="btn-main btn-wide" id="btnLogin" data-i18n="auth.login"></button>
    </div>

    <div id="tabSignup" class="hidden">
      <label data-i18n="auth.usernameRule"></label>
      <input id="suUser" autocomplete="username" autocapitalize="none" spellcheck="false"
             maxlength="20" data-i18n-ph="auth.usernamePh">
      <div style="height:11px"></div>
      <label data-i18n="auth.displayName"></label>
      <input id="suName" maxlength="24" data-i18n-ph="auth.displayNamePh">
      <div style="height:11px"></div>
      <label data-i18n="auth.passwordRule"></label>
      <input id="suPass" type="password" autocomplete="new-password">
      <div style="height:11px"></div>
      <label data-i18n="auth.rankEstimate"></label>
      <select id="suRank">
        <option value="100" data-i18n="rank.20k"></option>
        <option value="600" data-i18n="rank.15k"></option>
        <option value="1100" data-i18n="rank.10k"></option>
        <option value="1600" data-i18n="rank.5k"></option>
        <option value="2000" data-i18n="rank.1k"></option>
        <option value="2100" data-i18n="rank.1d"></option>
      </select>
      <div style="height:15px"></div>
      <button class="btn-main btn-wide" id="btnSignup" data-i18n="auth.signup"></button>
      <div class="hint" style="margin-top:9px" data-i18n="auth.noEmailNote"></div>
    </div>

    <div class="err" id="authErr" style="margin-top:11px"></div>
    <div style="border-top:1px solid var(--line); margin:14px 0"></div>
    <button class="btn-ghost btn-wide" id="btnGuest" data-i18n="auth.guest"></button>
    <div class="hint" style="margin-top:9px" data-i18n="auth.guestNote"></div>
    <div class="hint" id="netStatus" style="margin-top:12px"></div>
  </div>
</section>

<!-- ═══════════ 2. หน้าแรก ═══════════ -->
<section id="scHome" class="hidden fade">
  <div class="row">
    <img class="brand-logo" src="/logo.svg" alt="Go Live">
    <div class="grow">
      <div class="pname" id="meName">—</div>
      <div class="psub" id="meRank">—</div>
    </div>
    <button class="btn-ghost btn-sm" id="btnSound">🔊</button>
    <button class="btn-ghost btn-sm lang-toggle" id="btnLang" type="button" aria-label="Language">TH</button>
    <button class="btn-ghost btn-sm" id="btnLogout" data-i18n="home.logout"></button>
  </div>

  <div class="card" id="firstTime">
    <div class="row" style="align-items:flex-start">
      <div class="grow hint" style="color:var(--shell)">
        <b data-i18n="home.helpTitle"></b><br>
        <span data-i18n="home.helpBody"></span>
      </div>
      <button class="btn-ghost btn-sm" id="btnDismissHelp" data-i18n="home.helpOk"></button>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:1rem;margin-bottom:12px" data-i18n="home.newGame"></h3>
    <label data-i18n="home.boardSize"></label>
    <div class="chips" id="sizeChips">
      <div class="chip on" data-size="9">9×9<span class="psub komi" style="margin-left:6px" data-komi="1.5"></span></div>
      <div class="chip" data-size="13">13×13<span class="psub komi" style="margin-left:6px" data-komi="3.5"></span></div>
      <div class="chip" data-size="19">19×19<span class="psub komi" style="margin-left:6px" data-komi="6.5"></span></div>
    </div>
    <div class="hint" style="margin-top:7px" id="sizeHint"></div>

    <div style="height:14px"></div>
    <label data-i18n="home.time"></label>
    <select id="selTime">
      <option value="300,30,3" data-i18n="time.live"></option>
      <option value="1200,0,0" data-i18n="time.friendship"></option>
      <option value="2100,0,0" data-i18n="time.kyu"></option>
      <option value="2700,0,0" data-i18n="time.dan"></option>
      <option value="3600,10,3" data-i18n="time.national"></option>
    </select>

    <div style="height:15px"></div>
    <button class="btn-main btn-wide" id="btnCreate" data-i18n="home.create"></button>
    <div style="height:9px"></div>
    <label data-i18n="home.aiLevel"></label>
    <div class="row">
      <select id="selAI" class="grow"></select>
      <button class="btn-ghost" id="btnAI" style="white-space:nowrap" data-i18n="home.aiBtn"></button>
    </div>
    <div class="hint" style="margin-top:7px" data-i18n="home.aiNote"></div>
  </div>

  <div class="card">
    <h3 style="font-size:1rem;margin-bottom:12px" data-i18n="home.joinTitle"></h3>
    <div class="row">
      <input id="inCode" class="grow" maxlength="6" placeholder="ABC123" autocapitalize="characters"
             style="text-transform:uppercase;letter-spacing:.2em;font-family:Mitr;text-align:center">
      <button class="btn-main" id="btnJoin" data-i18n="home.enter"></button>
    </div>
  </div>
</section>

<!-- ═══════════ 3. หน้าเกม ═══════════ -->
<section id="scGame" class="hidden fade">
  <div class="row">
    <button class="btn-ghost btn-sm" id="btnLeave" data-i18n="game.leave"></button>
    <div class="grow" style="text-align:center">
      <span id="onAirBadge" class="onair hidden" data-i18n="game.onAir"></span>
    </div>
    <button class="btn-ghost btn-sm" id="btnSound2">🔊</button>
    <button class="btn-ghost btn-sm lang-toggle" type="button" aria-label="Language">TH</button>
    <button class="btn-ghost btn-sm" id="btnCopy"><span id="copyLbl"></span> <span id="gCode" style="color:var(--kaya)">——</span></button>
  </div>

  <div id="pTop" class="pcard">
    <span class="dot" id="topDot"></span>
    <div class="grow"><div class="pname" id="topName"></div><div class="psub" id="topSub">—</div></div>
    <div><div class="clock" id="topClock">—</div><div class="psub" id="topCap" style="text-align:right"></div></div>
  </div>

  <div class="boardwrap"><canvas id="board" width="900" height="900"></canvas></div>

  <div id="pBot" class="pcard me">
    <span class="dot" id="botDot"></span>
    <div class="grow"><div class="pname" id="botName"></div><div class="psub" id="botSub">—</div></div>
    <div><div class="clock" id="botClock">—</div><div class="psub" id="botCap" style="text-align:right"></div></div>
  </div>

  <div id="statusBar" class="status" data-i18n="game.connecting"></div>

  <div class="bar" id="barWait">
    <button class="btn-main grow" id="btnReady" data-i18n="game.ready"></button>
  </div>

  <div class="bar hidden" id="barConfirm">
    <button class="btn-ghost" id="btnCancelMove" data-i18n="game.cancel"></button>
    <button class="btn-main grow" id="btnPlaceHere" data-i18n="game.placeHere"></button>
  </div>

  <div class="bar hidden" id="barPlay">
    <button class="btn-ghost grow" id="btnPass" data-i18n="game.pass"></button>
    <button class="btn-ghost grow" id="btnResign" data-i18n="game.resign"></button>
  </div>

  <div class="hidden" id="barMark">
    <div class="status" style="margin-bottom:10px" data-i18n="game.markHelp"></div>
    <div class="row">
      <button class="btn-main grow" id="btnConfirm" data-i18n="game.confirmScore"></button>
      <button class="btn-ghost grow" id="btnResume" data-i18n="game.resume"></button>
    </div>
  </div>

  <div class="hidden card" id="barEnd">
    <h3 id="endTitle" style="font-size:1.3rem;margin-bottom:7px">—</h3>
    <div class="hint" id="endDetail"></div>
    <div style="height:14px"></div>
    <div class="row">
      <button class="btn-ghost grow" id="btnSGF" data-i18n="game.saveSgf"></button>
      <button class="btn-main grow" id="btnHome" data-i18n="game.backHome"></button>
    </div>
  </div>
</section>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
 *  ตั้งค่า — ใส่ค่าของโปรเจกต์ Supabase ของคุณตรงนี้
 *  anon key เปิดเผยได้ ปลอดภัยเพราะมี RLS คุมอยู่แล้ว
 * ═══════════════════════════════════════════════════════════ */
const CONFIG = {
  // ห้ามใส่เครื่องหมาย / ปิดท้าย URL
  SUPABASE_URL: 'https://msllwhkdppprymojhcwv.supabase.co',
  // anon key เปิดเผยได้ ปลอดภัยเพราะมี RLS คุมอยู่
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zbGx3aGtkcHBwcnltb2poY3d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Mzc5MzksImV4cCI6MjEwMDQxMzkzOX0.KgVRMgkIlStIrfdM6yjRmaev0PJi7Mp1bZejJqMmOSc',
  SERVER_URL: location.origin.replace(/^http/, 'ws'),
};

const $ = id => document.getElementById(id);

/* ── ภาษา: ไทย / อังกฤษ / ญี่ปุ่น ── */
const I = window.I18N;
const LANG_ORDER = ['th', 'en', 'ja'];
function guessLang(){
  const saved = localStorage.getItem('gb_lang');
  if (LANG_ORDER.includes(saved)) return saved;
  const n = (navigator.language || 'th').toLowerCase();
  if (n.startsWith('ja')) return 'ja';
  if (n.startsWith('th')) return 'th';
  return 'en';
}
let LANG = guessLang();
const T = (k, v) => (I ? I.T(k, v, LANG) : k);
const gorLabel = g => (I ? I.rankLabel(g, LANG) : '—');
const DEFAULT_AI_LEVELS = [
  { id:'firstSteps', rank:'30k' }, { id:'novice', rank:'25k' },
  { id:'starter', rank:'20k' }, { id:'beginner', rank:'15k' },
  { id:'developing', rank:'12k' }, { id:'foundation', rank:'10k' },
  { id:'club', rank:'8k' }, { id:'intermediate', rank:'5k' },
  { id:'strongKyu', rank:'3k' }, { id:'advanced', rank:'1k' },
  { id:'expert', rank:'1d' }, { id:'master', rank:'3d' },
  { id:'grandmaster', rank:'5d' }, { id:'amateurElite', rank:'7d' },
  { id:'amateurChampion', rank:'9d' }, { id:'proEntry', rank:'1p' },
  { id:'pro', rank:'3p' }, { id:'elitePro', rank:'6p' },
  { id:'worldPro', rank:'9p' },
];
let aiLevels = DEFAULT_AI_LEVELS;

function localizedRank(rank){
  const m = String(rank || '').match(/^(\d+)([kdp])$/);
  if (!m) return rank || '—';
  const key = m[2] === 'k' ? 'rank.kyu' : (m[2] === 'd' ? 'rank.dan' : 'rank.pro');
  return T(key, { n:m[1] });
}

function renderAILevelOptions(){
  const select = $('selAI');
  const keep = select.value || 'foundation';
  const options = aiLevels.map(level => {
    const option = document.createElement('option');
    option.value = level.id;
    option.textContent = `${T('ai.level.' + level.id)} · ${localizedRank(level.rank)}`;
    return option;
  });
  select.replaceChildren(...options);
  select.value = aiLevels.some(level => level.id === keep) ? keep : (aiLevels[0]?.id || '');
}

/* ── แถบแจ้งข้อผิดพลาดบนหน้าจอ ──
 * เดิมถ้าสคริปต์ภายนอกโหลดไม่สำเร็จ ทั้งหน้าจะตายเงียบ ๆ กดปุ่มอะไรก็ไม่มีอะไรเกิดขึ้น
 * ตอนนี้จะขึ้นข้อความบอกสาเหตุแทน */
function fatal(msg){
  let box = $('fatalBox');
  if (!box){
    box = document.createElement('div');
    box.id = 'fatalBox';
    box.style.cssText = 'position:fixed;left:10px;right:10px;top:10px;z-index:999;background:#5A1E19;'
      + 'color:#FFE9E6;border:1px solid #C2372E;border-radius:12px;padding:12px 14px;'
      + 'font-size:.85rem;line-height:1.6;white-space:pre-wrap';
    document.body.appendChild(box);
  }
  box.textContent = (window.I18N ? window.I18N.T('err.fatal', null, LANG) : 'Error: ') + msg;
}
addEventListener('error', e => fatal((e.message || '?') + (e.filename ? '\n' + e.filename : '')));
addEventListener('unhandledrejection', e => fatal(String(e.reason && e.reason.message || e.reason)));

/* ── ตรวจว่าสคริปต์ภายนอกโหลดครบไหม แล้วค่อยเริ่ม ── */
const hasSB = /^https:\/\/[a-z0-9]+\.supabase\.co$/.test(CONFIG.SUPABASE_URL)
           && CONFIG.SUPABASE_ANON_KEY.split('.').length === 3
           && typeof window.supabase !== 'undefined';
const sb = hasSB ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

// เอนจินโกะใช้ตรวจกติกาและคำนวณพื้นที่ฝั่งเบราว์เซอร์
// ถ้าโหลดไม่ได้ก็ยังเล่นได้ เพียงแต่ต้องรอเซิร์ฟเวอร์ตอบว่าตาไหนผิดกติกา
const GoBoard = (window.GoEngine && window.GoEngine.GoGame) || null;   // ตั้งชื่อไม่ให้ชนกับคลาสในไลบรารี
const show = id => ['scAuth','scHome','scGame'].forEach(s => $(s).classList.toggle('hidden', s !== id));
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
}

/* ═══════════ เสียง — Web Audio ทั้งหมด ═══════════ */
const Sound = (() => {
  let ctx = null, bus = {}, on = localStorage.getItem('gb_sound') !== 'off';
  const buffers = new Map();
  function init(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (const n of ['bgm','sfx','voice']) {
      const g = ctx.createGain(); g.gain.value = n === 'bgm' ? .3 : .65;
      g.connect(ctx.destination); bus[n] = g;
    }
  }
  const unlock = () => { init(); if (ctx.state === 'suspended') ctx.resume(); };
  function blip(f, d, type='sine', b='sfx', v=.5){
    if (!ctx || !on) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + d);
    o.connect(g); g.connect(bus[b]); o.start(); o.stop(ctx.currentTime + d);
  }
  const SFX = {
    stone:      () => blip(330, .085, 'triangle', 'sfx', .6),
    capture:    () => { blip(190,.15,'square','sfx',.42); setTimeout(()=>blip(120,.22,'square','sfx',.36),70); },
    pass:       () => blip(250, .17),
    player_join:() => { blip(520,.1); setTimeout(()=>blip(720,.13),95); },
    game_start: () => { blip(440,.12); setTimeout(()=>blip(660,.19),125); },
    game_end:   () => { blip(340,.2); setTimeout(()=>blip(226,.32),175); },
    illegal:    () => blip(105, .13, 'sawtooth', 'sfx', .32),
    tick:       () => blip(880, .04, 'sine', 'sfx', .25),
  };
  function playBuf(id){
    if (!ctx) return;
    const s = ctx.createBufferSource(); s.buffer = buffers.get(id);
    s.connect(bus.sfx); s.start();
  }
  /* BGM ใช้ AudioBufferSourceNode + loop=true เท่านั้น
     จึงไม่มีทางที่เพลงจะเงียบเองตอนจบแทร็ก (บั๊กเดิมของ Math Battle) */
  let bgmSrc = null;
  const stopBGM = () => { if (bgmSrc){ try{ bgmSrc.stop(); }catch{} bgmSrc = null; } };
  function playBGM(id){
    const buf = buffers.get(id); if (!ctx || !buf) return;
    stopBGM();
    bgmSrc = ctx.createBufferSource(); bgmSrc.buffer = buf;
    bgmSrc.loop = true; bgmSrc.connect(bus.bgm); bgmSrc.start();
  }
  /* โหลดไฟล์เสียงให้ครบก่อนเริ่มเล่น (Preload Gate)
     เซิร์ฟเวอร์ส่งมาแค่ "ชื่อเสียง" ทุกเครื่องเล่นจากไฟล์ของตัวเอง
     จึงไม่มีอาการเสียงดังแค่ฝั่งโฮสต์อีก */
  async function preload(manifest, onProgress){
    init(); let done = 0;
    for (const { id, url } of manifest){
      try {
        const buf = await fetch(url).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b));
        buffers.set(id, buf);
      } catch(e){ console.warn('โหลดเสียงไม่สำเร็จ', id, e); }
      onProgress && onProgress(++done / manifest.length);
    }
  }
  // เสียงจากเซิร์ฟเวอร์ใช้ชื่อสั้น ส่วนช่องไฟล์ใช้ชื่อยาว จับคู่กันตรงนี้
  const SLOT = { stone:'sfx_stone', capture:'sfx_capture', pass:'sfx_pass',
                 game_start:'sfx_start', game_end:'sfx_end', cut:'sfx_cut' };
  return {
    unlock, preload, playBGM, stopBGM, buffers, SLOT,
    has: id => buffers.has(SLOT[id] || id),
    play: id => {
      if (!on) return;
      const slot = SLOT[id] || id;
      buffers.has(slot) ? playBuf(slot) : (SFX[id] && SFX[id]());
    },
    toggle(){ on = !on; localStorage.setItem('gb_sound', on ? 'on' : 'off'); if (!on) stopBGM(); return on; },
    get isOn(){ return on; },
  };
})();

 * ทุกเครื่องโหลดไฟล์เองแล้วเล่นจากเครื่องตัวเอง ไม่มีการสตรีมเสียงข้ามเครื่อง

let audioManifest = null, bgmNow = null;
async function applyManifest(mf){
  audioManifest = mf;
  const list = (mf.assets || []).filter(a => a.url).map(a => ({ id:a.id, url:a.url }));
  if (!list.length) return;
  try { await Sound.preload(list); } catch (e) { console.warn('preload', e); }
  updateBGM(true);
}
function updateBGM(force){
  if (!Sound.isOn) { Sound.stopBGM(); bgmNow = null; return; }
  const st = view && view.state;
  let want = 'bgm_lobby';
  if (st === 'playing') want = 'bgm_play';
  else if (st === 'finished') want = 'bgm_result';
  if (st === 'playing' && clockBase){
    const c = clockBase.clocks[clockBase.turn === 1 ? 'black' : 'white'];
    if (c && c.main === 0) want = 'bgm_tense';
  }
  if (!Sound.buffers.has(want)) want = Sound.buffers.has('bgm_lobby') ? 'bgm_lobby' : null;
  if (!want){ Sound.stopBGM(); bgmNow = null; return; }
  if (want !== bgmNow || force){ bgmNow = want; Sound.playBGM(want); }
}

const USER_DOMAIN = 'gobattle.local';
const toEmail = u => u.trim().toLowerCase() + '@' + USER_DOMAIN;
const USER_RE  = /^[a-z0-9_]{3,20}$/;

function authErrText(err){
  const m = String(err && err.message || err || '').toLowerCase();
  if (m.includes('already registered') || m.includes('already been registered')
      || m.includes('duplicate')) return T('err.taken');
  if (m.includes('invalid login')) return T('err.wrongLogin');
  if (m.includes('email not confirmed')) return T('err.notConfirmed');
  if (m.includes('password')) return T('err.passwordShort');
  if (m.includes('invalid') && m.includes('email')) return T('err.usernameBad');
  if (m.includes('fetch') || m.includes('network')) return T('err.network');
  return T('err.signupFailed');
}

$('btnSignup').onclick = async () => {
  $('authErr').textContent = '';
  if (!sb) return $('authErr').textContent = T('err.dbNotReady');
  const user = $('suUser').value.trim().toLowerCase();
  const name = $('suName').value.trim() || user;
  const pass = $('suPass').value;
  if (!USER_RE.test(user)) return $('authErr').textContent = T('err.usernameBad');
  if (pass.length < 6)     return $('authErr').textContent = T('err.passwordShort');

  $('btnSignup').disabled = true; $('btnSignup').textContent = T('auth.signingUp');
  try {
    const { data, error } = await sb.auth.signUp({
      email: toEmail(user), password: pass,
      options: { data: { display_name: name, username: user } },
    });
    if (error) throw error;

    if (!data.session){
      $('authErr').textContent = T('err.noSession');
      return;
    }
    const gor = +$('suRank').value;
    for (const size of [9, 13, 19]){
      await sb.from('ratings').upsert({ user_id: data.user.id, board_size: size, gor, peak_gor: gor });
    }
    await afterLogin(data.session);
  } catch (e){
    $('authErr').textContent = authErrText(e);
  } finally {
    $('btnSignup').disabled = false; $('btnSignup').textContent = T('auth.signup');
  }
};

/* ═══════════ WebSocket ═══════════ */
let retry = 0, pendingRoom = null;
function connect(name){
  paintNet(T('home.netSrvConnecting'));
  try { ws = new WebSocket(CONFIG.SERVER_URL); }
  catch (e){ return fatal('WebSocket: ' + e.message); }

  ws.onopen = () => {
    retry = 0;
    paintNet(T('home.netSrvOk'));
    ws.send(JSON.stringify({ t:'auth', accessToken, name, playerToken }));
  };
  ws.onerror = () => paintNet(T('home.netSrvFail'));
  ws.onclose = () => {
    const el = $('statusBar'); if (el) el.textContent = T('game.disconnected');
    paintNet(T('home.netSrvLost'));
    setTimeout(() => connect(name), Math.min(8000, 800 * ++retry));
  };
  ws.onmessage = e => {
    try { onMessage(JSON.parse(e.data)); }
    catch (err){ console.error('ข้อความจากเซิร์ฟเวอร์ผิดรูปแบบ', err); }
  };
}
const sendWs = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function onMessage(m){
  switch (m.t){
    case 'welcome':
      playerToken = m.playerToken; localStorage.setItem('gb_token', playerToken);
      if (!$('meName').textContent || $('meName').textContent === '—') $('meName').textContent = m.name;
      if (Array.isArray(m.aiLevels) && m.aiLevels.length) {
        aiLevels = m.aiLevels;
        renderAILevelOptions();
      }
      if (m.guest) { isGuest = true; paintMyRank(); }
      if (!m.dbOn) console.info('เซิร์ฟเวอร์ยังไม่ได้เชื่อม Supabase — เล่นได้แต่ไม่บันทึกผล');
      if (pendingRoom){ sendWs({ t:'join', code: pendingRoom }); pendingRoom = null; }
      else show('scHome');
      break;
    case 'joined':
      myColor = m.color; ghost = null; show('scGame');
      $('gCode').textContent = m.code;
      history.replaceState(null, '', '#' + m.code);
      if (m.spectator)   toast(T('game.spectatorJoined'));
      if (m.reconnected) toast(T('game.reconnected'));
      break;
    case 'manifest': applyManifest(m); break;
    case 'state': applyState(m); break;
    case 'end':   applyState(m); showEnd(m); break;
    case 'room_closed':
      toast(T('game.roomClosed'));
      view = null; myColor = null; ghost = null; clockBase = null;
      history.replaceState(null, '', location.pathname);
      show('scHome');
      updateBGM(true);
      break;
    case 'sfx':   Sound.play(m.id); break;
    case 'emoji': toast((m.from || '') + ' ' + m.id); break;
    case 'error': toast(m.code ? T('srv.' + m.code) : m.msg); Sound.play('illegal'); shake(); break;
  }
}

function applyState(m){
  view = m; boardSize = m.game.size;
  clockBase = { at: Date.now(), clocks: m.clocks, turn: m.game.turn };

  // สำเนาเกมฝั่งเบราว์เซอร์ ใช้ตรวจกติกาและคำนวณพื้นที่โดยไม่ต้องรอเซิร์ฟเวอร์
  if (GoBoard){
    localGame = new GoBoard({ size: m.game.size, komi: m.game.komi });
    localGame.board.set(m.game.board);
    localGame.turn = m.game.turn;
    localGame.koPoint = m.game.koPoint;
    localGame.state = 'playing';
  }

  // มุมมอง: ฝ่ายเรา (หรือดำถ้าเป็นผู้ชม) อยู่ด้านล่างเสมอ
  const meIsWhite = myColor === 'W';
  const P = m.players;
  paintCard('top', meIsWhite ? P.black : P.white, meIsWhite ? 1 : 2, m);
  paintCard('bot', meIsWhite ? P.white : P.black, meIsWhite ? 2 : 1, m);
  $('pTop').classList.toggle('turn', m.state === 'playing' && m.game.turn === (meIsWhite ? 1 : 2));
  $('pBot').classList.toggle('turn', m.state === 'playing' && m.game.turn === (meIsWhite ? 2 : 1));
  $('onAirBadge').classList.toggle('hidden', !m.onAir);

  paintBars(); paintStatus(); draw(); updateBGM();
}

function paintCard(pos, p, colorNum, m){
  $(pos+'Dot').className = 'dot ' + (colorNum === 1 ? 'b' : 'w');
  $(pos+'Name').textContent = p
    ? p.name + (p.ai ? ' 🤖' : '') + (!p.ai && p.online === false ? ' ' + T('game.offline') : '')
    : T('game.waitingPlayer');
  $(pos+'Sub').textContent = p ? localizedRank(p.rank) : '—';
  $(pos+'Cap').textContent = T('game.prisoners', { n: colorNum === 1 ? m.game.prisoners.black : m.game.prisoners.white });
}

function paintBars(){
  const s = view && view.state;
  const myTurn = view && myColor && view.game.turn === (myColor === 'B' ? 1 : 2);
  $('barWait').classList.toggle('hidden', !(s === 'waiting' || s === 'ready'));
  $('barConfirm').classList.toggle('hidden', !(s === 'playing' && ghost));
  $('barPlay').classList.toggle('hidden', !(s === 'playing' && !ghost));
  $('barMark').classList.toggle('hidden', s !== 'marking');
  $('barEnd').classList.toggle('hidden', s !== 'finished');
  const ready = view && (myColor === 'B' ? view.ready.black : view.ready.white);
  $('btnReady').textContent = ready ? T('game.readyWait') : T('game.ready');
  $('btnReady').disabled = !!ready || !myColor;
  $('btnPass').disabled = !myTurn;
  $('btnResign').disabled = !myColor;
}

function paintStatus(){
  const st = $('statusBar'), m = view; if (!m) return;
  st.classList.remove('calm');
  if (m.state === 'waiting'){
    st.textContent = T('game.statusWaiting', { code: m.code });
    st.classList.add('calm');
  } else if (m.state === 'ready'){
    st.textContent = T('game.statusReady');
    st.classList.add('calm');
  } else if (m.state === 'playing'){
    const myTurn = myColor && m.game.turn === (myColor === 'B' ? 1 : 2);
    st.textContent = myColor
      ? (myTurn ? (ghost ? T('game.statusConfirm') : T('game.statusYourTurn'))
                : T('game.statusWaitOther'))
      : T('game.statusSpectate', {
          turn: m.game.turn === 1 ? T('game.turnBlack') : T('game.turnWhite'),
          n: m.game.moveCount });
    if (!myTurn) st.classList.add('calm');
  } else if (m.state === 'marking'){
    const mine = myColor === 'B' ? m.confirms.black : m.confirms.white;
    st.textContent = mine ? T('game.statusMarkMine') : T('game.statusMark');
  }
}

function showEnd(m){
  const r = m.result, s = m.score || r.score;
  const who = r.type === 'black_win' ? T('end.blackWin') : r.type === 'white_win' ? T('end.whiteWin')
            : r.type === 'draw' ? T('end.draw') : T('end.noResult');
  $('endTitle').textContent = `${who} · ${r.text}`;
  const REASON = { resign:'end.reasonResign', timeout:'end.reasonTimeout',
                   forfeit:'end.reasonForfeit', repeat:'end.reasonRepeat' };
  $('endDetail').innerHTML = s
    ? `<b>${T('end.detailBlack', { total:s.black, terr:s.territory.black, pris:s.prisoners.black })}</b><br>`
    + `<b>${T('end.detailWhite', { total:s.white, terr:s.territory.white, pris:s.prisoners.white, komi:s.komi })}</b><br>`
    + `<span style="color:var(--muted)">${T('end.dame', { n:s.dameCount })}</span>`
    : (r.reasonCode ? T(REASON[r.reasonCode] || 'end.noResult') : (r.reason || ''));
  paintBars();
}

/* ═══════════ วาดกระดาน ═══════════ */
const cv = $('board'), cx = cv.getContext('2d');
const LETTERS = 'ABCDEFGHJKLMNOPQRST';
let geo = null;

function computeGeo(){
  const N = boardSize, S = 900;
  const pad = S * (N <= 9 ? .085 : N <= 13 ? .065 : .05);
  const gap = (S - pad * 2) / (N - 1);
  geo = { N, S, pad, gap, R: gap * .47 };
  return geo;
}

// คำนวณพื้นที่คร่าว ๆ ฝั่งเบราว์เซอร์ ใช้แสดงตอนตกลงหมากตาย
function territoryPreview(dead){
  if (!localGame) return null;
  const N = boardSize, b = Uint8Array.from(localGame.board);
  for (const i of dead) b[i] = 0;
  const owner = new Int8Array(N * N), seen = new Uint8Array(N * N);
  for (let i = 0; i < N * N; i++){
    if (b[i] !== 0 || seen[i]) continue;
    const pts = [], borders = new Set(), stack = [i]; seen[i] = 1;
    while (stack.length){
      const j = stack.pop(); pts.push(j);
      const jx = j % N, jy = (j / N) | 0;
      for (const [nx, ny] of localGame.neighbors(jx, jy)){
        const ni = ny * N + nx;
        if (b[ni] === 0){ if (!seen[ni]){ seen[ni] = 1; stack.push(ni); } }
        else borders.add(b[ni]);
      }
    }
    if (borders.size === 1){ const c = [...borders][0]; for (const p of pts) owner[p] = c; }
  }
  return owner;
}

function draw(){
  if (!view) return;
  const { N, S, pad, gap, R } = computeGeo();
  cv.width = S; cv.height = S;

  // พื้นไม้
  const g0 = cx.createLinearGradient(0, 0, S, S);
  g0.addColorStop(0, '#EDC37B'); g0.addColorStop(.55, '#DCAE5E'); g0.addColorStop(1, '#C48E3D');
  cx.fillStyle = g0; cx.fillRect(0, 0, S, S);

  // เส้นกระดาน
  cx.strokeStyle = '#6B4E22'; cx.lineWidth = N > 13 ? 1.6 : 2.2;
  for (let i = 0; i < N; i++){
    const p = pad + i * gap;
    cx.beginPath(); cx.moveTo(pad, p); cx.lineTo(S - pad, p); cx.stroke();
    cx.beginPath(); cx.moveTo(p, pad); cx.lineTo(p, S - pad); cx.stroke();
  }
  // พิกัดตัวอักษร/ตัวเลข ช่วยผู้เริ่มต้นและใช้เรียกตำแหน่งตอนไลฟ์
  cx.fillStyle = 'rgba(90,64,26,.75)';
  cx.font = `${Math.max(14, gap * .32)}px 'IBM Plex Sans Thai', sans-serif`;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let i = 0; i < N; i++){
    cx.fillText(LETTERS[i], pad + i * gap, pad * .45);
    cx.fillText(String(N - i), pad * .45, pad + i * gap);
  }

  // จุดดาว
  const stars = N === 9 ? [2,4,6] : N === 13 ? [3,6,9] : [3,9,15];
  cx.fillStyle = '#6B4E22';
  for (const a of stars) for (const b of stars){
    cx.beginPath(); cx.arc(pad + a*gap, pad + b*gap, Math.max(3.5, gap*.09), 0, 7); cx.fill();
  }

  const dead = new Set(view.dead || []);
  const board = view.game.board;

  // เงาพื้นที่ ตอนตกลงหมากตาย
  if (view.state === 'marking'){
    const owner = territoryPreview(dead);
    if (owner) for (let i = 0; i < N*N; i++){
      if (!owner[i]) continue;
      const x = i % N, y = (i / N) | 0;
      cx.fillStyle = owner[i] === 1 ? 'rgba(20,16,12,.34)' : 'rgba(255,252,242,.5)';
      cx.fillRect(pad + x*gap - gap*.2, pad + y*gap - gap*.2, gap*.4, gap*.4);
    }
  }

  // หมาก
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const v = board[y*N + x]; if (!v) continue;
    const isDead = dead.has(y*N + x);
    drawStone(x, y, v, isDead ? .3 : 1);
    if (isDead){
      const px = pad + x*gap, py = pad + y*gap;
      cx.strokeStyle = '#C2372E'; cx.lineWidth = Math.max(3, gap*.09);
      cx.beginPath();
      cx.moveTo(px - R*.5, py - R*.5); cx.lineTo(px + R*.5, py + R*.5);
      cx.moveTo(px + R*.5, py - R*.5); cx.lineTo(px - R*.5, py + R*.5); cx.stroke();
    }
  }

  // ตาล่าสุด — จุดตราประทับสีชาด
  const lm = view.game.lastMove;
  if (lm && !lm.pass && !ghost){
    cx.fillStyle = '#C2372E';
    cx.beginPath(); cx.arc(pad + lm.x*gap, pad + lm.y*gap, R*.3, 0, 7); cx.fill();
  }

  // จุดติดโคะ
  if (view.game.koPoint != null){
    const k = view.game.koPoint, kx = k % N, ky = (k / N) | 0;
    cx.strokeStyle = '#8E251E'; cx.lineWidth = Math.max(2.5, gap*.08);
    cx.strokeRect(pad + kx*gap - R*.45, pad + ky*gap - R*.45, R*.9, R*.9);
  }

  // หมากที่กำลังเล็งไว้ (ยังไม่ยืนยัน)
  if (ghost){
    drawStone(ghost.x, ghost.y, myColor === 'B' ? 1 : 2, .55);
    cx.strokeStyle = '#C2372E'; cx.lineWidth = Math.max(3, gap*.08);
    cx.beginPath(); cx.arc(pad + ghost.x*gap, pad + ghost.y*gap, R*1.25, 0, 7); cx.stroke();
  }
}

function drawStone(x, y, color, alpha){
  const { pad, gap, R } = geo;
  const px = pad + x*gap, py = pad + y*gap;
  cx.globalAlpha = alpha;
  cx.beginPath(); cx.arc(px + R*.09, py + R*.13, R, 0, 7);
  cx.fillStyle = 'rgba(60,40,10,.3)'; cx.fill();
  const g = cx.createRadialGradient(px - R*.34, py - R*.4, R*.08, px, py, R);
  if (color === 1){ g.addColorStop(0, '#5B534C'); g.addColorStop(1, '#15120F'); }
  else            { g.addColorStop(0, '#FFFFFB'); g.addColorStop(1, '#D0C8B3'); }
  cx.beginPath(); cx.arc(px, py, R, 0, 7); cx.fillStyle = g; cx.fill();
  cx.globalAlpha = 1;
}

/* ═══════════ แตะกระดาน ═══════════
 * มือถือ: แตะเลือกจุด → ตรวจดู → กด “วางตรงนี้” (กันวางพลาด)
 * เมาส์ : คลิกวางได้เลย
 */
function pointAt(ev){
  const { N, S, pad, gap } = computeGeo();
  const r = cv.getBoundingClientRect(), sc = S / r.width;
  const fx = ((ev.clientX - r.left) * sc - pad) / gap;
  const fy = ((ev.clientY - r.top ) * sc - pad) / gap;
  const x = Math.round(fx), y = Math.round(fy);
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  if (Math.hypot(fx - x, fy - y) > .62) return null;   // แตะห่างจากจุดตัดเกินไป
  return { x, y };
}

cv.addEventListener('click', ev => {
  if (!view) return;
  const p = pointAt(ev); if (!p) return;

  if (view.state === 'marking'){
    if (view.game.board[p.y * boardSize + p.x] === 0) return toast(T('game.tapStone'));
    sendWs({ t:'toggle_dead', x:p.x, y:p.y });
    return;
  }
  if (view.state !== 'playing' || !myColor) return;
  if (view.game.turn !== (myColor === 'B' ? 1 : 2)) return toast(T('game.notYourTurn'));

  // ตรวจกติกาทันทีฝั่งเบราว์เซอร์ — ไม่ต้องรอเซิร์ฟเวอร์ตอบ
  const reason = localGame && localGame.illegalReason(p.x, p.y, myColor === 'B' ? 1 : 2);
  if (reason){ toast(T('srv.' + reason)); Sound.play('illegal'); shake(); return; }

  if (!isTouch){ sendWs({ t:'play', x:p.x, y:p.y }); return; }
  ghost = p; paintBars(); paintStatus(); draw();
});

/* ═══════════ นาฬิกา — เซิร์ฟเวอร์เป็นเจ้าของ เบราว์เซอร์แค่วาดตาม ═══════════ */
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${(s/60)|0}:${String(s%60).padStart(2,'0')}`; };
setInterval(() => {
  if (!clockBase || !view || view.state !== 'playing') return;
  const el = Date.now() - clockBase.at;
  const meIsWhite = myColor === 'W';
  for (const [pos, num] of [['top', meIsWhite ? 1 : 2], ['bot', meIsWhite ? 2 : 1]]){
    const c = clockBase.clocks[num === 1 ? 'black' : 'white'];
    const live = clockBase.turn === num ? el : 0;
    const node = $(pos + 'Clock');
    if (c.main > 0){
      const left = c.main - live;
      node.textContent = fmt(left);
      node.classList.toggle('warn', left < 30000);
      node.classList.remove('pulse');
    } else {
      const left = Math.max(0, (c.byoyomi || 0) - live);
      node.textContent = T('game.byoyomi', { s: Math.ceil(left/1000), p: c.periods });
      node.classList.add('warn');
      node.classList.toggle('pulse', clockBase.turn === num);
      if (clockBase.turn === num && myColor && num === (myColor === 'B' ? 1 : 2)){
        const s = Math.ceil(left / 1000);
        if (s <= 5 && s !== lastByoTick){ lastByoTick = s; Sound.play('tick'); }
      }
    }
  }
}, 200);

window.addEventListener('resize', () => draw());
</script>
