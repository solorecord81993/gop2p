<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Go Battle LIVE">
<meta name="theme-color" content="#f5f2eb">
<title>ภาพออกอากาศ — Go Battle Live</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<script src="/go-engine.js"></script>
<script src="/i18n.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
 *  ภาพออกอากาศ 1080 × 1920 แนวตั้งสำหรับ TikTok
 *  เขตปลอดภัย: เว้นบน 250px และล่าง 400px ไว้ให้ UI ของ TikTok
 *  ใส่ใน OBS เป็น Browser Source ขนาด 1080×1920
 * ═══════════════════════════════════════════════════════════════ */
:root{
  --sumi:#0F0C0A; --panel:#1C1714; --line:#3A302A;
  --kaya:#E2B565; --shell:#F6F2E7; --shu:#C2372E; --matcha:#7E9468; --muted:#9A8E82;
  --safe-top:250px; --safe-bot:400px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#stage{
  position:absolute; top:50%; left:50%; transform-origin:center;
  width:1080px; height:1920px; margin:-960px 0 0 -540px;
  padding-top:var(--safe-top); padding-bottom:var(--safe-bot);
  background:
    radial-gradient(1200px 900px at 50% 42%, #241D18 0%, var(--sumi) 70%),
    var(--sumi);
  color:var(--shell); font-family:'IBM Plex Sans Thai',sans-serif;
  display:flex; flex-direction:column;
  padding-left:48px; padding-right:48px;
}
.dp{font-family:'Mitr',sans-serif;font-weight:500}
.hidden{display:none !important}

/* ── แถบหัว ── */
.head{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.seal{width:64px;height:64px;border-radius:10px;background:var(--shu);color:#fff;
  display:grid;place-items:center;font-family:'Mitr';font-size:34px;
  box-shadow:inset 0 0 0 2px #8E251E}
.title{font-family:'Mitr';font-size:34px;line-height:1.1}
.sub{font-size:20px;color:var(--muted)}
.roomtag{margin-left:auto;font-family:'Mitr';font-size:26px;color:var(--kaya);
  border:2px solid var(--line);border-radius:12px;padding:8px 18px;letter-spacing:.12em}

/* ── การ์ดผู้เล่น ── */
.pcard{display:flex;align-items:center;gap:18px;background:var(--panel);
  border:2px solid var(--line);border-left:8px solid transparent;
  border-radius:18px;padding:18px 22px;transition:border-color .25s,background .25s}
.pcard.turn{border-left-color:var(--shu);background:#261E1A}
.stone{width:52px;height:52px;border-radius:50%;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.6)}
.stone.b{background:radial-gradient(circle at 32% 30%,#5B534C,#15120F)}
.stone.w{background:radial-gradient(circle at 32% 30%,#FFFFFB,#CFC7B2)}
.pname{font-family:'Mitr';font-size:36px;line-height:1.15}
.prank{font-size:22px;color:var(--muted)}
.pright{margin-left:auto;text-align:right}
.clock{font-family:'Mitr';font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.clock.warn{color:var(--shu)}
.clock.pulse{animation:pulse .9s infinite}
@keyframes pulse{50%{opacity:.4}}
.cap{font-size:20px;color:var(--muted);margin-top:4px}

/* ── แถบประเมินคะแนน ── */
.bar{height:16px;border-radius:8px;overflow:hidden;background:#000;
  border:2px solid var(--line);margin:16px 0;display:flex}
.bar i{display:block;height:100%;transition:width .5s ease}
.bar .b{background:linear-gradient(90deg,#3A332C,#15120F)}
.bar .w{background:linear-gradient(90deg,#E8E2D0,#FFFDF4)}
.barlabel{display:flex;justify-content:space-between;font-size:20px;color:var(--muted);margin-top:-6px}

/* ── กระดาน ── */
.boardbox{flex:1;display:grid;place-items:center;position:relative;margin:10px 0 18px}
#board{width:min(960px, 100%);height:auto;aspect-ratio:1/1;border-radius:18px;box-shadow:0 14px 46px rgba(0,0,0,.65)}
#board.wipe{animation:wipe .8s ease}
#board.fadein{animation:fadein .45s ease}
.result-card{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,84%);padding:34px 38px;text-align:center;border-radius:24px;
  background:rgba(20,16,13,.94);border:3px solid var(--kaya);
  box-shadow:0 18px 70px rgba(0,0,0,.72),inset 0 0 40px rgba(226,181,101,.08)}
.result-kicker{font-family:'Mitr';font-size:25px;letter-spacing:.16em;color:var(--kaya)}
.result-winner{font-family:'Mitr';font-size:54px;line-height:1.2;margin:12px 0 20px}
.result-scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result-score{padding:13px;border-radius:13px;font-family:'Mitr';font-size:28px}
.result-score.black{background:#111;color:#fff;border:1px solid #4d443c}
.result-score.white{background:#f8f4e8;color:#1b1714;border:1px solid #fff}
.result-hold{font-size:20px;color:var(--muted);margin-top:18px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes wipe{
  0%{clip-path:inset(0 100% 0 0);filter:brightness(1.6)}
  60%{clip-path:inset(0 0 0 0);filter:brightness(1.15)}
  100%{clip-path:inset(0 0 0 0);filter:none}
}

/* ── ข้อความ MC ── */
.mc{background:var(--panel);border:2px solid var(--line);border-radius:18px;
  padding:20px 24px;font-size:26px;line-height:1.5;min-height:96px;
  display:flex;align-items:center;gap:16px}
.mc .who{font-family:'Mitr';color:var(--shu);flex:none}

/* ── จอว่าง ── */
.idle{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#2b2119,var(--sumi) 68%);z-index:20;padding:250px 72px 400px}
.idle .in{text-align:center;width:100%}
.idle-logo{width:210px;height:210px;margin:0 auto 18px}
.idle .big{font-family:'Mitr';font-size:56px;margin-bottom:12px}
.idle .small{font-size:26px;color:var(--muted);line-height:1.45}
.idle-join{display:flex;align-items:center;justify-content:center;gap:30px;margin:28px auto 24px;padding:24px;background:#fff;border-radius:22px;max-width:760px;color:#17120f}
.idle-join img{width:230px;height:230px;image-rendering:pixelated}
.idle-copy{text-align:left;max-width:390px}.idle-copy strong{display:block;font-family:'Mitr';font-size:32px;color:var(--shu);margin-bottom:10px}
.idle-link{font-size:22px;overflow-wrap:anywhere;color:#4c3b30}
.idle-mc{margin:0 auto;padding:18px 24px;max-width:760px;border:2px solid var(--line);border-radius:18px;background:var(--panel);font-size:25px;line-height:1.5}

/* ── คัตซีนค่ายกล (เห็นเฉพาะบนไลฟ์) ── */
#cut{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0}
#cut.on{animation:cutscene 3s ease forwards}
#cut .veil{position:absolute;inset:0;background:rgba(8,6,5,.62)}
#cut .rays{position:absolute;inset:0;
  background:repeating-linear-gradient(100deg,transparent 0 26px,rgba(194,55,46,.16) 26px 34px)}
#cut .plate{position:absolute;left:0;right:0;top:44%;text-align:center}
#cut .kanji{font-family:'Noto Sans JP',sans-serif;font-size:40px;color:var(--kaya);letter-spacing:.3em}
#cut .name{font-family:'Mitr';font-size:76px;color:#fff;text-shadow:0 6px 26px rgba(194,55,46,.8)}
#cut .tier{display:inline-block;margin-top:14px;font-family:'Mitr';font-size:30px;
  background:var(--shu);color:#fff;padding:6px 26px;border-radius:999px;letter-spacing:.14em}
#cut .brush{position:absolute;left:8%;right:8%;top:63%;height:10px;background:var(--shu);
  border-radius:6px;transform-origin:left center;transform:scaleX(0);
  animation:brush .5s .5s ease forwards}
@keyframes brush{to{transform:scaleX(1)}}
@keyframes cutscene{
  0%{opacity:0} 12%{opacity:1} 88%{opacity:1} 100%{opacity:0}
}
#customCut{position:absolute;inset:0;z-index:45;background:#000;opacity:0;pointer-events:none;display:grid;place-items:center}
#customCut.on{animation:customCutscene 5s ease forwards}
#customCut img{width:100%;height:100%;object-fit:cover}
@keyframes customCutscene{0%{opacity:0} 8%{opacity:1} 88%{opacity:1} 100%{opacity:0}}

/* ── หน้าจอเริ่มถ่ายทอด (จำเป็นสำหรับ iPhone: ปลดล็อกเสียง + กันจอดับ) ── */
#boot{position:fixed;inset:0;z-index:90;background:#0F0C0A;color:#F6F2E7;
  display:grid;place-items:center;text-align:center;padding:8vw;
  font-family:'IBM Plex Sans Thai',sans-serif}
#boot .b1{font-family:'Mitr';font-size:7vw;margin-bottom:2vh}
#boot .b2{font-size:4vw;color:#9A8E82;line-height:1.7;margin-bottom:4vh}
#boot button{font-family:'Mitr';font-size:5.5vw;background:#C2372E;color:#fff;border:none;
  border-radius:16px;padding:4vw 10vw}
</style>
<link rel="stylesheet" href="/ui-light.css">
</head>
<body>

<div id="boot">
  <div>
    <div class="b1" id="bootTitle"></div>

  </div>
</div>

<div id="stage">

  <div class="head">
    <img class="brand-logo" src="/logo.svg" alt="Go Live" style="width:64px;height:64px">
    <div>
      <div class="title" id="tTitle">Go Battle Live</div>

    </div>
    <div class="roomtag" id="roomTag">——</div>
  </div>

  <div class="pcard" id="cardTop">

  <div id="cut">

    <div class="in">
      <img class="idle-logo" src="/logo.svg" alt="Go Live">

        <img id="joinQr" alt="QR code to join Go Live">
        <div class="idle-copy"><strong id="joinTitle"></strong><div class="idle-link" id="joinLink"></div></div>
      </div>
      <div class="idle-mc"><b id="idleMcWho">MC</b> · <span id="idleMcText"></span></div>
    </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
 *  หน้านี้ "อ่านอย่างเดียว" ไม่มีการสั่งอะไรกลับไปที่เกม
 *  เชื่อม WebSocket แล้วส่ง {t:'live'} เพื่อขอรับภาพของห้องที่ออกอากาศ
 *  เวลาผู้กำกับกด TAKE เซิร์ฟเวอร์ส่ง program + state ใหม่มาให้
 *  หน้านี้จะ "ไม่รีโหลด" แต่ทำทรานซิชันแล้ววาดห้องใหม่ทับ
 * ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);

// ถ้ามีอะไรพัง ให้ขึ้นข้อความบนจอ ดีกว่าปล่อยให้ภาพค้างเฉย ๆ กลางไลฟ์
addEventListener('error', e => {
  const el = document.getElementById('idleSmall');
  if (el) el.textContent = 'Error: ' + (e.message || '?');
});
const TRANSITION = P.get('t') || 'ink';       // ink | fade | cut
const GoBoard = (window.GoEngine && window.GoEngine.GoGame) || null;   // ตั้งชื่อไม่ให้ชนกับคลาสในไลบรารี   // ถ้าโหลดไม่ได้ ยังแสดงภาพได้ปกติ

const AUTO = P.get('auto') === '1' || P.get('auto') === 'true';

// ประกาศไว้ตั้งแต่ต้น เพราะ applyLang() ด้านล่างอ้างถึง view
let view = null, program = null, clockBase = null, localGame = null;
const I = window.I18N || { T:(k)=>k, SPEECH_LANG:{th:'th-TH',en:'en-US',ja:'ja-JP'}, rankLabel:()=> '—' };
let LANG = ['th','en','ja'].includes(P.get('lang')) ? P.get('lang') : 'th';
const T = (k, v) => I.T(k, v, LANG);

/* ── เสียงพากย์ MC ──
 * ใช้ speechSynthesis ของเบราว์เซอร์ ไม่ต้องพึ่งบริการภายนอก
 * iPhone ต้องมีการแตะก่อนหนึ่งครั้งถึงจะพูดได้ — ปุ่ม "แตะเพื่อเริ่ม" ทำหน้าที่นั้น
 */
const Speech = (() => {
  let enabled = false, voices = [];
  const supported = typeof speechSynthesis !== 'undefined';
  function loadVoices(){ if (supported) voices = speechSynthesis.getVoices() || []; }
  if (supported && typeof speechSynthesis.addEventListener === 'function') {
    speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }
  function pick(lang){
    const code = I.SPEECH_LANG[lang] || 'th-TH';
    return voices.find(v => v.lang === code)
        || voices.find(v => (v.lang || '').toLowerCase().startsWith(lang))
        || null;
  }
  return {
    unlock(){
      if (!supported) return false;
      enabled = true; loadVoices();
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0; speechSynthesis.speak(u);
      } catch { return false; }
      return true;
    },
    say(text, lang){
      if (!enabled || !supported || !text) return false;
      try {
        if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = I.SPEECH_LANG[lang] || 'th-TH';
        const v = pick(lang); if (v) u.voice = v;
        u.rate = 1.05;
        speechSynthesis.speak(u);
        return true;
      } catch (e) { console.warn('พูดไม่ได้', e); return false; }
    },
    stop(){
      if (!supported) return;
      try { speechSynthesis.cancel(); } catch {}
    },
    get supported(){ return supported; },
  };
})();

/* ── ปรับขนาดให้พอดีจอ ──
 * คอมพิวเตอร์/OBS : รักษาสัดส่วน 1080×1920 พอดีกรอบ
 * มือถือ (จอสูงกว่า 9:16) : ขยายเต็มความกว้าง แล้วยืดความสูงตามจอจริง
 *                            เพื่อไม่ให้มีแถบดำตอนแชร์หน้าจอ
 */
function fit(){
  const W = 1080, H = 1920, vw = innerWidth, vh = innerHeight;
  const tall = vh / vw > H / W;
  const sc = tall ? vw / W : Math.min(vw / W, vh / H);
  const h  = tall ? Math.round(vh / sc) : H;
  const st = $('stage');
  st.style.height = h + 'px';
  st.style.marginTop = (-h / 2) + 'px';
  st.style.transform = `scale(${sc})`;
  // เขตปลอดภัย: บนมือถือ TikTok มีปุ่มและคอมเมนต์ทับมากกว่า
  const top = tall ? Math.round(h * 0.12) : 250;
  const bot = tall ? Math.round(h * 0.30) : 400;
  st.style.setProperty('--safe-top', top + 'px');
  st.style.setProperty('--safe-bot', bot + 'px');
  document.documentElement.style.setProperty('--board-max', Math.min(960, W - 96) + 'px');
}
function applyLang(){
  $('tTagline').textContent  = T('app.tagline');
  $('mcWho').textContent     = T('mc.label');
  $('bootTitle').textContent = T('live.bootTitle');
  $('bootBody').textContent  = T('live.bootBody');
  $('btnBoot').textContent   = T('live.bootBtn');
  $('idleBig').textContent   = AUTO ? T('live.waitTitleAuto') : T('live.waitTitle');
  $('idleSmall').textContent = AUTO ? T('live.waitBodyAuto')  : T('live.waitBody');
  $('joinTitle').textContent = T('live.joinTitle');
  $('idleMcWho').textContent = T('mc.label');
  if (!program) $('idleMcText').textContent = T('mc.invite');
  if (!$('mcText').textContent) $('mcText').textContent = T('mc.waiting');
  document.documentElement.lang = LANG;
  if (view) applyState(view);
}
applyLang();
const joinUrl = new URL('/', location.href).href;
$('joinLink').textContent = joinUrl;
$('joinQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data=' + encodeURIComponent(joinUrl);
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 300));
fit();

/* ── เสียงบนภาพออกอากาศ (iPhone ต้องมีการแตะก่อนถึงจะเล่นได้) ── */
const Snd = (() => {
  let ctx = null, on = false;
  let bgmSrc = null, bgmGain = null, bgmSlot = null, wantedBGM = null;
  let ducked = false;
  const buffers = new Map();

  function init(){
    if (ctx) return ctx;
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return null;
    ctx = new Audio();
    return ctx;
  }

  async function resume(){
    if (!ctx) return false;
    try { if (ctx.state === 'suspended') await ctx.resume(); } catch {}
    ensureBGM();
    return ctx.state === 'running' || ctx.state === undefined;
  }

  async function unlock(){
    if (!init()) return false;
    on = true;
    await resume();
    return true;
  }
  function blip(f, d, type='sine', v=.45){
    if (!ctx || !on) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + d);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d);
  }
  const map = {
    stone:      () => blip(330, .085, 'triangle', .5),
    capture:    () => { blip(190,.15,'square',.4); setTimeout(()=>blip(120,.22,'square',.34),70); },
    pass:       () => blip(250, .17),
    game_start: () => { blip(440,.12); setTimeout(()=>blip(660,.19),125); },
    game_end:   () => { blip(340,.2); setTimeout(()=>blip(226,.32),175); },
    player_join:() => { blip(520,.1); setTimeout(()=>blip(720,.13),95); },
    cut:        () => { blip(880,.09,'square',.5); setTimeout(()=>blip(1320,.28,'square',.42),90); },
  };
  const SLOT = { stone:'sfx_stone', capture:'sfx_capture', pass:'sfx_pass',
                 game_start:'sfx_start', game_end:'sfx_end', cut:'sfx_cut' };

  function stopBGM(clearWanted = true){
    const old = bgmSrc;
    bgmSrc = null; bgmGain = null; bgmSlot = null;
    if (old) { try { old.stop(); } catch {} }
    if (clearWanted) wantedBGM = null;
  }

  function startBGM(slot){
    if (!on || !ctx || !buffers.has(slot)) return false;
    if (bgmSrc && bgmSlot === slot) return true;
    stopBGM(false);
    const source = ctx.createBufferSource();
    const gain = ctx.createGain();
    source.buffer = buffers.get(slot);
    source.loop = true;
    gain.gain.value = ducked ? .08 : .28;
    source.connect(gain); gain.connect(ctx.destination);
    bgmSrc = source; bgmGain = gain; bgmSlot = slot;
    source.onended = () => {
      if (bgmSrc !== source) return;
      bgmSrc = null; bgmGain = null; bgmSlot = null;
      if (wantedBGM === slot && on) setTimeout(() => startBGM(slot), 0);
    };
    try { source.start(); } catch { stopBGM(false); return false; }
    return true;
  }

  function ensureBGM(){
    if (wantedBGM) startBGM(wantedBGM);
  }

  return {
    unlock, resume, buffers,
    play(id){
      if (!on) return;
      resume();
      const slot = SLOT[id] || id;
      if (ctx && buffers.has(slot)){
        const s = ctx.createBufferSource(); s.buffer = buffers.get(slot);
        const g = ctx.createGain(); g.gain.value = .8;
        s.connect(g); g.connect(ctx.destination); s.start();
        return;
      }
      map[id] && map[id]();
    },
    async preload(list){
      if (!init()) return;
      for (const { id, url } of list){
        try {
          const buf = await fetch(url).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b));
          buffers.set(id, buf);
        } catch (e) { console.warn('โหลดเสียงไม่สำเร็จ', id, e); }
      }
      ensureBGM();
    },
    // เพลงประกอบต้องวนเสมอ ไม่มีทางเงียบเองตอนจบแทร็ก
    playBGM(slot, force = false){
      wantedBGM = slot || null;
      if (force && bgmSlot === slot) stopBGM(false);
      return startBGM(slot);
    },
    stopBGM,
    ensureBGM,
    has: id => buffers.has(SLOT[id] || id),
    duck(value){
      ducked = !!value;
      if (bgmGain) bgmGain.gain.value = ducked ? .08 : .28;
    },   // หรี่เพลงตอน MC พูด และคืนเสียงเมื่อหยุดพูด
    get isOn(){ return on; },
  };
})();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    Snd.resume();
    Snd.ensureBGM();
    updateBGM(false);
  }
});

/* ── กันหน้าจอดับระหว่างถ่ายทอด ── */
let wakeLock = null;
async function keepAwake(){
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible' && 'wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
        }
      });
    }
  } catch {}
}

$('btnBoot').onclick = async () => {
  await Snd.unlock();
  Speech.unlock();
  keepAwake();
  $('boot').style.display = 'none';
  fit();
  fetch('/api/manifest').then(r => r.json()).then(applyManifest).catch(() => {});
};

/* ── ควบคุมเสียง MC แยกจากเพลง ──
 * ปิด MC ต้องหยุด speech ที่กำลังค้างและคืนระดับเพลงทันที
 * เปิด MC ใหม่ต้องไม่ถูกคำพูดเก่าหรือ timer เก่ากดทับ
 */
let mcAutoEnabled = true;
let voiceSeq = 0;
let voiceTimer = null;
function stopMCVoice(){
  voiceSeq++;
  clearTimeout(voiceTimer);
  voiceTimer = null;
  Speech.stop();
  Snd.duck(false);
  Snd.ensureBGM();
}
function speakMC(text, lang){
  const seq = ++voiceSeq;
  clearTimeout(voiceTimer);
  voiceTimer = null;
  const spoken = Speech.say(text, lang);
  if (!spoken) { Snd.duck(false); return; }
  Snd.duck(true);
  voiceTimer = setTimeout(() => {
    if (seq !== voiceSeq) return;
    Snd.duck(false);
    Snd.ensureBGM();
  }, Math.min(12000, 1400 + String(text || '').length * 90));
}


/* ── WebSocket ── */
let retry = 0;
function connect(){
  const ws = new WebSocket(location.origin.replace(/^http/, 'ws'));
  ws.onopen = () => {
    retry = 0;
    ws.send(JSON.stringify({ t:'auth', name:'live-view' }));
    setTimeout(() => ws.send(JSON.stringify({ t:'live', auto: AUTO, lang: LANG })), 120);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'program'){
      const changed = m.code !== program;
      program = m.code;
      $('idle').classList.toggle('hidden', !!program);
      if (!program || changed) $('resultCard').classList.add('hidden');
      if (!program) { view = null; clockBase = null; updateBGM(true); }
      if (changed && program) playTransition(m.transition || TRANSITION);
    }
    if (m.t === 'state' || m.t === 'end') applyState(m);
    if (m.t === 'room_closed' && m.code === program) $('resultCard').classList.add('hidden');
    if (m.t === 'highlight') playCutscene(m);      // ค่ายกล — เห็นเฉพาะบนไลฟ์
    if (m.t === 'custom_cutscene') playCustomCutscene(m);
    if (m.t === 'mc'){
      if (!mcAutoEnabled) return;
      setMC(m.text);
      if (!program) $('idleMcText').textContent = m.text;
      speakMC(m.text, m.lang || LANG);
    }
    if (m.t === 'manifest') applyManifest(m);
    if (m.t === 'mc_info'){
      if (m.lang) LANG = m.lang;
      mcAutoEnabled = m.auto !== false;
      if (!mcAutoEnabled) stopMCVoice();
    }
    if (m.t === 'mc_stop') { mcAutoEnabled = false; stopMCVoice(); }
    if (m.t === 'sfx') Snd.play(m.id);
  };
  ws.onclose = () => setTimeout(connect, Math.min(6000, 700 * ++retry));
}
connect();

let bgmNow = null;
async function applyManifest(mf){
  const list = (mf.assets || []).filter(a => a.url).map(a => ({ id:a.id, url:a.url }));
  if (!list.length) { bgmNow = null; updateBGM(true); return; }
  await Snd.preload(list);
  updateBGM(true);
}
function updateBGM(force){
  const st = view && view.state;
  let want = 'bgm_lobby';
  if (st === 'playing') want = 'bgm_play';
  else if (st === 'finished') want = 'bgm_result';
  if (st === 'playing' && clockBase){
    const c = clockBase.clocks[clockBase.turn === 1 ? 'black' : 'white'];
    if (c && c.main === 0) want = 'bgm_tense';
  }
  if (!Snd.buffers.has(want)) want = Snd.buffers.has('bgm_lobby') ? 'bgm_lobby' : null;
  if (!want) { bgmNow = null; return Snd.stopBGM(); }
  if (want !== bgmNow || force){ bgmNow = want; Snd.playBGM(want, force); }
  else Snd.ensureBGM();
}

function playTransition(kind){
  const c = $('board');
  c.classList.remove('wipe','fadein');
  void c.offsetWidth;                       // บังคับให้แอนิเมชันเริ่มใหม่
  if (kind === 'ink')  c.classList.add('wipe');
  if (kind === 'fade') c.classList.add('fadein');
}

let mcSpokenAt = 0;
function setMC(text, soft){
  // soft = ข้อความสถานะ จะไม่ทับประโยคที่ MC เพิ่งพูดภายใน 6 วินาที
  if (soft && Date.now() - mcSpokenAt < 6000) return;
  if (!soft) mcSpokenAt = Date.now();
  $('mcText').textContent = text;
}

/* ── รับสถานะห้อง ── */
function applyState(m){
  if (program && m.code !== program) return;   // สนใจเฉพาะห้องที่ออกอากาศ
  view = m;
  clockBase = { at: Date.now(), clocks: m.clocks, turn: m.game.turn };

  if (GoBoard){
    localGame = new GoBoard({ size:m.game.size, komi:m.game.komi });
    localGame.board.set(m.game.board);
    localGame.turn = m.game.turn;
  }

  $('roomTag').textContent = T('live.room', { code:m.code });

  // ขาวอยู่บน ดำอยู่ล่าง (ตามธรรมเนียมการถ่ายทอดโกะ)
  paint('top', m.players.white, 2, m);
  paint('bot', m.players.black, 1, m);
  $('cardTop').classList.toggle('turn', m.state === 'playing' && m.game.turn === 2);
  $('cardBot').classList.toggle('turn', m.state === 'playing' && m.game.turn === 1);

  updateBar();
  draw();
  updateBGM();

  // ข้อความสถานะใช้เฉพาะตอนที่ MC ยังไม่พูดอะไร เพื่อไม่ให้ทับเสียงพากย์
  if (m.state === 'waiting')      setMC(T('mc.roomWaiting', { code:m.code }), true);
  else if (m.state === 'ready')   setMC(T('mc.ready'), true);
  else if (m.state === 'marking') setMC(T('mc.marking'), true);
  else if (m.state === 'finished' && m.result){
    const who = m.result.type === 'black_win' ? T('end.blackWin')
              : m.result.type === 'white_win' ? T('end.whiteWin')
              : m.result.type === 'draw' ? T('end.draw') : T('end.noResult');
    setMC(`${who} · ${m.result.text}`, true);
    if (m.mode === 'ai_vs_ai') showResult(m, who);
    else $('resultCard').classList.add('hidden');
  }
  if (m.state !== 'finished' || !m.result) $('resultCard').classList.add('hidden');
}

function paint(pos, p, colorNum, m){
  $(pos+'Stone').className = 'stone ' + (colorNum === 1 ? 'b' : 'w');
  $(pos+'Name').textContent = p ? p.name : T('game.waitingPlayer');
  $(pos+'Rank').textContent = p ? T('live.rankSys', { rank:p.rank }) : '—';
  $(pos+'Cap').textContent  = T('game.prisoners', { n: colorNum === 1 ? m.game.prisoners.black : m.game.prisoners.white });
}

function showResult(m, who){
  $('resultWinner').textContent = `${who} · ${m.result.text}`;
  const score = m.score || m.result.score;
  $('resultScores').classList.toggle('hidden', !score);
  if (score){
    $('resultBlack').textContent = T('live.resultBlack', { n:score.black });
    $('resultWhite').textContent = T('live.resultWhite', { n:score.white });
  }
  $('resultCard').classList.remove('hidden');
}

/* ── แถบประเมินคะแนน: อิทธิพลอย่างง่าย + เชลย + โคมิ ── */
function estimate(){
  if (!view) return { b:0.5, black:0, white:0 };
  const finalScore = view.state === 'finished' && (view.score || view.result?.score);
  if (finalScore){
    const total = finalScore.black + finalScore.white || 1;
    return { b:finalScore.black / total, black:finalScore.black, white:finalScore.white };
  }
  if (!localGame) {   // ไม่มีเอนจิน ใช้จำนวนเม็ดหมากบนกระดานประมาณคร่าว ๆ แทน
    const bd = view.game.board;
    let nb = 0, nw = 0;
    for (const v of bd){ if (v === 1) nb++; else if (v === 2) nw++; }
    const black = nb + view.game.prisoners.black;
    const white = nw + view.game.prisoners.white + view.game.komi;
    return { b: black / (black + white || 1), black:Math.round(black), white:Math.round(white*10)/10 };
  }
  const N = view.game.size, b = view.game.board;
  // แผนที่อิทธิพล: แผ่จากเม็ดหมากออกไป 4 รอบ (Bouzy อย่างย่อ)
  let inf = new Float32Array(N*N);
  for (let i = 0; i < N*N; i++) inf[i] = b[i] === 1 ? 48 : b[i] === 2 ? -48 : 0;
  for (let pass = 0; pass < 4; pass++){
    const nx = Float32Array.from(inf);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
      const i = y*N + x; let s = inf[i], n = 1;
      for (const [ax, ay] of localGame.neighbors(x, y)){ s += inf[ay*N+ax]; n++; }
      nx[i] = s / n;
    }
    inf = nx;
  }
  let tb = 0, tw = 0;
  for (let i = 0; i < N*N; i++){ if (inf[i] > 3) tb++; else if (inf[i] < -3) tw++; }
  const black = tb + view.game.prisoners.black;
  const white = tw + view.game.prisoners.white + view.game.komi;
  const total = black + white || 1;
  return { b: black / total, black:Math.round(black), white:Math.round(white*10)/10 };
}

function updateBar(){
  const e = estimate();
  const pct = Math.max(6, Math.min(94, e.b * 100));
  $('barB').style.width = pct + '%';
  $('barW').style.width = (100 - pct) + '%';
  $('barBTxt').textContent = T('live.barBlack', { n:e.black });
  $('barWTxt').textContent = T('live.barWhite', { n:e.white });
}

/* ── วาดกระดาน ── */
const cv = $('board'), cx = cv.getContext('2d');
const LETTERS = 'ABCDEFGHJKLMNOPQRST';

function draw(){
  if (!view) return;
  const N = view.game.size, S = 960;
  const pad = S * (N <= 9 ? .085 : N <= 13 ? .066 : .052);
  const gap = (S - pad*2) / (N - 1), R = gap * .47;
  cv.width = S; cv.height = S;

  const g0 = cx.createLinearGradient(0, 0, S, S);
  g0.addColorStop(0, '#EDC37B'); g0.addColorStop(.55, '#DCAE5E'); g0.addColorStop(1, '#C48E3D');
  cx.fillStyle = g0; cx.fillRect(0, 0, S, S);

  cx.strokeStyle = '#6B4E22'; cx.lineWidth = N > 13 ? 1.8 : 2.4;
  for (let i = 0; i < N; i++){
    const p = pad + i*gap;
    cx.beginPath(); cx.moveTo(pad, p); cx.lineTo(S-pad, p); cx.stroke();
    cx.beginPath(); cx.moveTo(p, pad); cx.lineTo(p, S-pad); cx.stroke();
  }
  cx.fillStyle = 'rgba(90,64,26,.72)';
  cx.font = `${Math.max(15, gap*.3)}px 'IBM Plex Sans Thai', sans-serif`;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let i = 0; i < N; i++){
    cx.fillText(LETTERS[i], pad + i*gap, pad*.45);
    cx.fillText(String(N - i), pad*.45, pad + i*gap);
  }
  const stars = N === 9 ? [2,4,6] : N === 13 ? [3,6,9] : [3,9,15];
  cx.fillStyle = '#6B4E22';
  for (const a of stars) for (const b2 of stars){
    cx.beginPath(); cx.arc(pad + a*gap, pad + b2*gap, Math.max(4, gap*.09), 0, 7); cx.fill();
  }

  const dead = new Set(view.dead || []), b = view.game.board;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const v = b[y*N + x]; if (!v) continue;
    const isDead = dead.has(y*N + x);
    cx.globalAlpha = isDead ? .32 : 1;
    cx.beginPath(); cx.arc(pad + x*gap + R*.1, pad + y*gap + R*.14, R, 0, 7);
    cx.fillStyle = 'rgba(60,40,10,.32)'; cx.fill();
    const px = pad + x*gap, py = pad + y*gap;
    const g = cx.createRadialGradient(px - R*.34, py - R*.4, R*.08, px, py, R);
    if (v === 1){ g.addColorStop(0, '#5B534C'); g.addColorStop(1, '#15120F'); }
    else        { g.addColorStop(0, '#FFFFFB'); g.addColorStop(1, '#D0C8B3'); }
    cx.beginPath(); cx.arc(px, py, R, 0, 7); cx.fillStyle = g; cx.fill();
    if (isDead){
      cx.strokeStyle = '#C2372E'; cx.lineWidth = Math.max(4, gap*.1);
      cx.beginPath();
      cx.moveTo(px-R*.5, py-R*.5); cx.lineTo(px+R*.5, py+R*.5);
      cx.moveTo(px+R*.5, py-R*.5); cx.lineTo(px-R*.5, py+R*.5); cx.stroke();
    }
    cx.globalAlpha = 1;
  }

  const lm = view.game.lastMove;
  if (lm && !lm.pass){
    cx.fillStyle = '#C2372E';
    cx.beginPath(); cx.arc(pad + lm.x*gap, pad + lm.y*gap, R*.3, 0, 7); cx.fill();
  }
  if (view.game.koPoint != null){
    const k = view.game.koPoint, kx = k % N, ky = (k/N)|0;
    cx.strokeStyle = '#8E251E'; cx.lineWidth = Math.max(3, gap*.08);
    cx.strokeRect(pad + kx*gap - R*.45, pad + ky*gap - R*.45, R*.9, R*.9);
  }

  // เรืองแสงเน้นค่ายกล ระหว่างคัตซีน
  if (cutCoords){
    cx.strokeStyle = 'rgba(226,181,101,.95)'; cx.lineWidth = Math.max(5, gap*.12);
    for (const [x, y] of cutCoords){
      cx.beginPath(); cx.arc(pad + x*gap, pad + y*gap, R*1.28, 0, 7); cx.stroke();
    }
  }
}

/* ── คัตซีนค่ายกล 3 วินาที — เห็นเฉพาะบนไลฟ์ ผู้เล่นไม่เห็น ── */
let cutCoords = null, cutBusy = false;
function playCutscene(m){
  if (cutBusy) return;                     // ไม่ซ้อนกัน คิวถัดไปทิ้ง
  cutBusy = true;
  cutCoords = m.coords || null;
  $('cutName').textContent  = (LANG === 'ja' && m.nameJa) ? m.nameJa : (m.nameTh || T('pat.snapback'));
  $('cutKanji').textContent = m.nameJa || '';
  $('cutTier').textContent  = m.tier || 'SR';
  Snd.play('cut');
  const el = $('cut');
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  draw();
  setTimeout(() => { cutBusy = false; cutCoords = null; el.classList.remove('on'); draw(); }, 3000);
}

let customCutBusy = false;
function playCustomCutscene(m){
  if (customCutBusy || !m.imageUrl) return;
  customCutBusy = true;
  $('customCutImage').src = m.imageUrl;
  if (m.audioUrl) {
    const audio = new Audio(m.audioUrl);
    audio.volume = .85;
    audio.play().catch(() => {});
  }
  const el = $('customCut');
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  setTimeout(() => { customCutBusy = false; el.classList.remove('on'); }, 5000);
}

/* ── นาฬิกา ── */
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return `${(s/60)|0}:${String(s%60).padStart(2,'0')}`; };
setInterval(() => {
  if (!clockBase || !view) return;
  const running = view.state === 'playing';
  const el = running ? Date.now() - clockBase.at : 0;
  for (const [pos, num] of [['top', 2], ['bot', 1]]){
    const c = clockBase.clocks[num === 1 ? 'black' : 'white'];
    if (!c) continue;
    const live = (running && clockBase.turn === num) ? el : 0;
    const node = $(pos + 'Clock');
    if (c.main > 0){
      const left = c.main - live;
      node.textContent = fmt(left);
      node.classList.toggle('warn', left < 30000);
      node.classList.remove('pulse');
    } else {
      const left = Math.max(0, (c.byoyomi || 0) - live);
      node.textContent = T('game.byoyomi', { s: Math.ceil(left/1000), p: c.periods });
      node.classList.add('warn');
      node.classList.toggle('pulse', running && clockBase.turn === num);
    }
  }
}, 200);

/* ── ทดสอบคัตซีนจากแถบที่อยู่: /live.html?demo=1 ── */
if (P.get('demo')){
  setTimeout(() => playCutscene({
    nameTh:T('pat.snapback'), nameJa:'ウッテガエシ', tier:'SSR',
    coords:[[3,3],[4,3],[3,4]],
  }), 1200);
}
