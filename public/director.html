<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องคอนโทรล — Go Battle Live</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<script src="/go-engine.js"></script>
<script src="/i18n.js"></script>
<style>
:root{--sumi:#161311;--sumi-2:#211C18;--sumi-3:#2C2621;--line:#3A322B;
      --kaya:#E2B565;--shell:#F6F2E7;--shu:#C2372E;--matcha:#7E9468;--muted:#9A8E82}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sumi);color:var(--shell);font-family:'IBM Plex Sans Thai',sans-serif;
     padding:18px;max-width:1180px;margin:0 auto}
h1,h2,h3,button,.dp{font-family:'Mitr',sans-serif;font-weight:500}
.card{background:var(--sumi-2);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1}
.hint{font-size:.8rem;color:var(--muted);line-height:1.6}
.hidden{display:none !important}
input{background:var(--sumi-3);border:1px solid var(--line);color:var(--shell);
      border-radius:10px;padding:12px;font:inherit;width:100%}
button{border:none;border-radius:11px;padding:12px 18px;cursor:pointer;color:var(--shell);
       background:var(--sumi-3);border:1px solid var(--line);transition:transform .07s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-take{background:var(--shu);color:#fff;border-color:var(--shu);font-size:1.1rem;padding:16px 34px}

.decks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.deck{border-radius:14px;padding:12px;background:var(--sumi-2);border:2px solid var(--line)}
.deck.program{border-color:var(--shu)}
.deck.preview{border-color:var(--matcha)}
.deck h3{font-size:.78rem;letter-spacing:.14em;margin-bottom:8px}
.deck.program h3{color:var(--shu)} .deck.preview h3{color:var(--matcha)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:12px}
.tile{background:var(--sumi-2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.tile.sel{border-color:var(--matcha);box-shadow:0 0 0 1px var(--matcha)}
.tile.live{border-color:var(--shu);box-shadow:0 0 0 1px var(--shu)}
.tile canvas{width:100%;height:auto;border-radius:7px;display:block}
.meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:7px}
.heat{height:5px;border-radius:3px;background:var(--sumi-3);overflow:hidden;margin-top:6px}
.heat > i{display:block;height:100%;background:linear-gradient(90deg,var(--matcha),var(--shu))}
.badge{background:var(--shu);color:#fff;font-size:.66rem;padding:2px 8px;border-radius:999px;font-family:Mitr}
.tag{font-size:.72rem;color:var(--muted)}
.sw{display:flex;align-items:center;gap:8px;font-size:.87rem}
@media(max-width:640px){.decks{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- เข้าสู่ระบบผู้กำกับ -->
<section id="gate">
  <h1 style="font-size:1.3rem;margin-bottom:6px" data-i18n="dir.title"></h1>
  <div class="hint" style="margin-bottom:16px" data-i18n="dir.subtitle"></div>
  <div class="card" style="max-width:400px">
    <div class="hint" style="margin-bottom:8px" data-i18n="dir.token"></div>
    <input id="tok" type="password" placeholder="DIRECTOR_TOKEN">
    <div style="height:12px"></div>
    <button class="btn-take" style="width:100%" id="btnEnter" data-i18n="dir.enter"></button>
    <div class="hint" id="gateErr" style="color:#E8877E;margin-top:10px"></div>
  </div>
</section>

<!-- หน้าคอนโทรล -->
<section id="panel" class="hidden">
  <div class="row" style="margin-bottom:14px">
    <h1 class="grow" style="font-size:1.2rem" data-i18n="dir.title"></h1>
    <select id="mcLang" style="background:var(--sumi-3);border:1px solid var(--line);color:var(--shell);
        border-radius:9px;padding:7px 10px;font:inherit;font-size:.8rem;width:auto">
      <option value="th">ไทย</option><option value="en">English</option><option value="ja">日本語</option>
    </select>
    <label class="sw" style="font-size:.8rem"><input type="checkbox" id="mcAuto" checked style="width:auto"> <span data-i18n="dir.mcAuto"></span></label>
    <span class="tag" id="clock">—</span>
    <span class="tag"><span data-i18n="dir.allRooms"></span> <b id="nRooms">0</b></span>
    <button id="btnSettings" style="padding:7px 12px;font-size:.8rem" data-i18n="set.open"></button>
    <a class="tag" id="lnkLive" href="/live.html" target="_blank" style="color:var(--kaya)" data-i18n="dir.openLive"></a>
  </div>

  <div class="decks">
    <div class="deck program">
      <h3 data-i18n="dir.program"></h3>
      <canvas id="cvProgram" width="380" height="380"></canvas>
      <div class="meta"><span id="pgTitle"></span><span id="pgInfo"></span></div>
    </div>
    <div class="deck preview">
      <h3 data-i18n="dir.preview"></h3>
      <canvas id="cvPreview" width="380" height="380"></canvas>
      <div class="meta"><span id="pvTitle"></span><span id="pvInfo"></span></div>
    </div>
  </div>

  <div class="row" style="margin:16px 0;justify-content:center;flex-wrap:wrap">
    <button class="btn-take" id="btnTake" disabled data-i18n="dir.take"></button>
    <button id="btnBlack" data-i18n="dir.black"></button>
    <label class="sw"><input type="checkbox" id="autoMode" style="width:auto"> <span data-i18n="dir.auto"></span></label>
    <span class="hint" data-i18n="dir.autoNote"></span>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="row" style="flex-wrap:wrap">
      <div style="min-width:220px" class="grow">
        <div class="hint" style="margin-bottom:6px" data-i18n="dir.mcLabel"></div>
        <div class="row">
          <input id="mcText" class="grow" data-i18n-ph="dir.mcPh">
          <button id="btnMC" data-i18n="dir.send"></button>
        </div>
      </div>
      <div style="min-width:260px">
        <div class="hint" style="margin-bottom:6px" data-i18n="dir.cutLabel"></div>
        <div class="row">
          <select id="selPattern" class="grow" style="background:var(--sumi-3);border:1px solid var(--line);
                  color:var(--shell);border-radius:10px;padding:12px;font:inherit">
            </select>
          <button id="btnCut" data-i18n="dir.fire"></button>
        </div>
      </div>
    </div>
    <div class="hint" style="margin-top:8px" data-i18n="dir.cutNote"></div>
  </div>

  <h3 style="font-size:.95rem;margin-top:6px" data-i18n="dir.rooms"></h3>
  <div class="hint" data-i18n="dir.roomsHint"></div>
  <div class="grid" id="grid"></div>
</section>

<!-- ═══════════ หน้าตั้งค่า ═══════════ -->
<section id="settings" class="hidden" style="position:fixed;inset:0;background:rgba(10,8,7,.94);
         overflow:auto;padding:20px;z-index:100">
  <div style="max-width:760px;margin:0 auto">
    <div class="row" style="margin-bottom:14px">
      <h2 class="grow" style="font-size:1.15rem" data-i18n="set.title"></h2>
      <button id="btnCloseSet" data-i18n="set.close"></button>
    </div>

    <div class="card" style="margin-bottom:14px">
      <h3 style="font-size:1rem;margin-bottom:6px" data-i18n="set.tabAI"></h3>
      <div class="hint" style="margin-bottom:12px" data-i18n="set.order"></div>

      <div class="hint" style="margin-bottom:5px"><span data-i18n="set.groqKey"></span> — <span id="groqState"></span></div>
      <input id="inGroq" type="password" autocomplete="off" placeholder="gsk_...">
      <div style="height:9px"></div>
      <div class="hint" style="margin-bottom:5px"><span data-i18n="set.orKey"></span> — <span id="orState"></span></div>
      <input id="inOR" type="password" autocomplete="off" placeholder="sk-or-...">
      <div style="height:9px"></div>
      <div class="hint" style="margin-bottom:5px" data-i18n="set.groqModel"></div>
      <input id="inGroqModel" autocomplete="off">
      <div style="height:9px"></div>
      <div class="hint" style="margin-bottom:5px" data-i18n="set.orModel"></div>
      <input id="inORModel" autocomplete="off">

      <div class="row" style="margin-top:12px;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:170px">
          <div class="hint" style="margin-bottom:5px" data-i18n="set.minGap"></div>
          <input id="inMinGap" type="number" min="1000" step="500">
        </div>
        <div style="flex:1;min-width:170px">
          <div class="hint" style="margin-bottom:5px" data-i18n="set.idleGap"></div>
          <input id="inIdle" type="number" min="3000" step="1000">
        </div>
      </div>

      <div class="hint" style="margin-top:12px" data-i18n="set.keyNote"></div>
      <div style="height:12px"></div>
      <button class="btn-take" id="btnSaveAI" data-i18n="set.save"></button>
      <span class="hint" id="saveState" style="margin-left:10px"></span>
    </div>

    <div class="card">
      <h3 style="font-size:1rem;margin-bottom:6px" data-i18n="set.tabAudio"></h3>
      <div class="hint" id="storageNote" style="margin-bottom:8px"></div>
      <div class="hint" style="margin-bottom:4px"><b><span data-i18n="set.fileTypes"></span>:</b> <span id="typeList"></span></div>
      <div class="hint" style="color:#E8A87E;margin-bottom:14px" data-i18n="set.iosWarn"></div>
      <div id="slotList"></div>
    </div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const I = window.I18N;
const LANG_ORDER = ['th','en','ja'];
let LANG = LANG_ORDER.includes(localStorage.getItem('gb_lang')) ? localStorage.getItem('gb_lang') : 'th';
const T = (k,v) => (I ? I.T(k,v,LANG) : k);
const PATTERNS = ['snapback','double_atari','nakade','ladder','net','ponnuki','ko','seki'];
const TIERS = { snapback:'SSR', double_atari:'SR', nakade:'SSR', ladder:'SR', net:'SR', ponnuki:'R', ko:'R', seki:'SSR' };

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = T(el.dataset.i18nPh));
  const sel = $('selPattern');
  const keep = sel.value;
  sel.innerHTML = PATTERNS.map(p =>
    `<option value="${p}">${I ? I.T('pat.'+p, null, 'th') : p} / ${I ? I.T('pat.'+p, null, 'ja') : ''} · ${TIERS[p]}</option>`).join('');
  if (keep) sel.value = keep;
  $('lnkLive').href = '/live.html?lang=' + LANG;
  if (SET) renderSlots();
  if (!program) $('pgTitle').textContent = T('dir.noRoom');
  if (!preview) $('pvTitle').textContent = T('dir.notPicked');
}

const WS_URL = location.origin.replace(/^http/, 'ws');
const DWELL_MS = 30000;

let ws = null, token = '', rooms = [], program = null, preview = null;
let states = new Map();          // code -> state ของห้องนั้น (มาจาก WS เฉพาะห้องที่ออกอากาศ)
let lastSwitchAt = 0;

$('btnEnter').onclick = () => {
  token = $('tok').value.trim();
  if (!token) return $('gateErr').textContent = T('dir.tokenEmpty');
  connect();
};
$('tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnEnter').click(); });
$('mcLang').value = LANG;
applyLang();

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ t:'auth', name:'director' }));
    setTimeout(() => ws.send(JSON.stringify({ t:'director_auth', token })), 120);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'director_ok'){
      $('gate').classList.add('hidden'); $('panel').classList.remove('hidden');
      program = m.program; applyLang(); poll(); setInterval(poll, 2000);
      ws.send(JSON.stringify({ t:'auto', value:false }));   // เปิดหน้านี้ = คุมเอง
    }
    if (m.t === 'error') $('gateErr').textContent = m.code ? T('srv.' + m.code) : m.msg;
    if (m.t === 'program'){ program = m.code; lastSwitchAt = Date.now(); render(); }
    if (m.t === 'auto'){ $('autoMode').checked = !!m.value; }
    if (m.t === 'mc_lang'){ $('mcLang').value = m.lang; }
    if (m.t === 'mc_auto'){ $('mcAuto').checked = !!m.value; }
    if (m.t === 'state' || m.t === 'end'){ states.set(m.code, m); render(); }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

async function poll(){
  try {
    const r = await fetch('/api/rooms').then(r => r.json());
    rooms = r.rooms; program = r.program;
    $('nRooms').textContent = rooms.length;
    $('clock').textContent = new Date().toLocaleTimeString(LANG === 'ja' ? 'ja-JP' : LANG === 'en' ? 'en-US' : 'th-TH');
    syncWatch();
    render();
  } catch {}
}

// ขอรับภาพสดของทุกห้องที่เปิดอยู่ (ผู้กำกับดูได้หลายห้องพร้อมกัน ไม่นั่งเป็นผู้เล่น)
function syncWatch(){
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ t:'watch', codes: rooms.map(r => r.code) }));
}

/* โหมดสลับอัตโนมัติทำงานที่เซิร์ฟเวอร์ ไม่ใช่ที่หน้านี้
   จึงยังทำงานต่อแม้ปิดหน้าเบื้องหลังไปแล้ว — สำคัญมากตอนถ่ายทอดด้วยมือถือ */
$('autoMode').onchange = () => ws.send(JSON.stringify({ t:'auto', value: $('autoMode').checked }));
$('mcAuto').onchange   = () => ws.send(JSON.stringify({ t:'mc_auto', value: $('mcAuto').checked }));
$('mcLang').onchange   = () => {
  LANG = $('mcLang').value;                       // ภาษาของหน้านี้ตามภาษาที่ให้ MC พูด
  localStorage.setItem('gb_lang', LANG);
  applyLang();
  ws.send(JSON.stringify({ t:'mc_lang', lang: LANG }));
};

function take(code){
  ws.send(JSON.stringify({ t:'program', code }));
  lastSwitchAt = Date.now();
  syncWatch();
}
$('btnTake').onclick = () => { if (preview) take(preview); };

$('btnBlack').onclick = () => {
  if (!confirm(T('dir.blackConfirm'))) return;
  ws.send(JSON.stringify({ t:'program', code:null }));
  program = null; lastSwitchAt = Date.now(); $('autoMode').checked = false; render();
};

/* ═══════════ หน้าตั้งค่า ═══════════ */
let SET = null;
const setHeaders = () => ({ 'x-director-token': token });

$('btnSettings').onclick = async () => {
  $('settings').classList.remove('hidden');
  await loadSettings();
};
$('btnCloseSet').onclick = () => $('settings').classList.add('hidden');

async function loadSettings(){
  try {
    SET = await fetch('/api/settings', { headers: setHeaders() }).then(r => r.json());
  } catch (e) { return alert(T('set.err', { m: e.message })); }
  if (SET.error) return alert(T('set.err', { m: SET.error }));

  $('groqState').textContent = SET.mc.groqKeySet ? T('set.keySet') + ' ' + SET.mc.groqKeyHint : T('set.keyNone');
  $('orState').textContent   = SET.mc.orKeySet   ? T('set.keySet') + ' ' + SET.mc.orKeyHint   : T('set.keyNone');
  $('inGroqModel').value = SET.mc.groqModel || '';
  $('inORModel').value   = SET.mc.orModel || '';
  $('inMinGap').value    = SET.mc.minGapMs || 7000;
  $('inIdle').value      = SET.mc.idleMs || 12000;
  $('storageNote').textContent = SET.storage === 'supabase' ? T('set.storageDb') : T('set.storageMem');
  $('typeList').textContent = SET.audioTypes
    .map(t => `${t.label} (.${t.ext})${t.ios ? '' : ' ✗iOS'}`).join(' · ');
  renderSlots();
}

function renderSlots(){
  const byKind = { bgm: [], sfx: [], cut: [] };
  for (const s of SET.slots) byKind[s.kind].push(s);
  const assets = Object.fromEntries(SET.audio.assets.map(a => [a.id, a]));
  const accept = SET.audioTypes.map(t => '.' + t.ext).join(',') + ',audio/*';

  const group = (title, list) => `
    <div style="margin-bottom:16px">
      <div class="hint" style="margin-bottom:8px"><b>${title}</b></div>
      ${list.map(s => {
        const a = assets[s.id] || {};
        return `<div class="row" style="margin-bottom:8px;flex-wrap:wrap;gap:8px">
          <div style="min-width:170px">
            <div style="font-size:.9rem">${T(s.i18n)}</div>
            <div class="hint">${a.url ? (a.name || '') + ' · ' + (a.ext || '').toUpperCase()
                                       + ' · ' + Math.round((a.size || 0) / 1024) + ' KB'
                                     : T('set.none')} · ${T('set.maxSize', { n: s.maxMB })}</div>
          </div>
          <label class="tag" style="cursor:pointer;border:1px solid var(--line);
                 border-radius:9px;padding:8px 12px">
            <span data-lbl>${T('set.upload')}</span>
            <input type="file" accept="${accept}" data-slot="${s.id}" style="display:none">
          </label>
          ${a.url ? `<button data-play="${a.url}" style="padding:8px 12px;font-size:.8rem">${T('set.preview')}</button>
                     <button data-del="${s.id}" style="padding:8px 12px;font-size:.8rem">${T('set.remove')}</button>` : ''}
        </div>`;
      }).join('')}
    </div>`;

  $('slotList').innerHTML =
      group(T('set.groupBgm'), byKind.bgm)
    + group(T('set.groupSfx'), byKind.sfx)
    + group(T('set.groupCut'), byKind.cut);

  $('slotList').querySelectorAll('input[type=file]').forEach(inp => {
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      const lbl = inp.parentElement.querySelector('[data-lbl]');
      lbl.textContent = T('set.uploading');
      try {
        const r = await fetch('/api/audio/' + inp.dataset.slot, {
          method: 'PUT',
          headers: { ...setHeaders(), 'Content-Type': f.type || 'application/octet-stream',
                     'x-file-name': encodeURIComponent(f.name) },
          body: f,
        }).then(r => r.json());
        if (r.error) throw new Error(r.error);
      } catch (e) { alert(T('set.err', { m: e.message })); }
      await loadSettings();
    };
  });
  $('slotList').querySelectorAll('[data-play]').forEach(b => {
    b.onclick = () => { const a = new Audio(b.dataset.play); a.volume = .6; a.play().catch(() => {}); };
  });
  $('slotList').querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      await fetch('/api/audio/' + b.dataset.del, { method:'DELETE', headers: setHeaders() });
      await loadSettings();
    };
  });
}

$('btnSaveAI').onclick = async () => {
  const body = {
    groqKey: $('inGroq').value.trim(),
    orKey: $('inOR').value.trim(),
    groqModel: $('inGroqModel').value.trim(),
    orModel: $('inORModel').value.trim(),
    minGapMs: +$('inMinGap').value || undefined,
    idleMs: +$('inIdle').value || undefined,
    lang: LANG,
  };
  try {
    const r = await fetch('/api/settings', {
      method:'POST', headers: { ...setHeaders(), 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    }).then(r => r.json());
    if (r.error) throw new Error(r.error);
    $('inGroq').value = ''; $('inOR').value = '';
    $('saveState').textContent = T('set.saved');
    setTimeout(() => $('saveState').textContent = '', 2500);
    await loadSettings();
  } catch (e) { alert(T('set.err', { m: e.message })); }
};

$('btnMC').onclick = () => {
  const text = $('mcText').value.trim(); if (!text) return;
  ws.send(JSON.stringify({ t:'mc', text }));
  $('mcText').value = '';
};
$('mcText').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnMC').click(); });

$('btnCut').onclick = () => {
  const p = $('selPattern').value;
  const nameTh = I ? I.T('pat.'+p, null, 'th') : p;
  const nameJa = I ? I.T('pat.'+p, null, 'ja') : '';
  const tier = TIERS[p] || 'SR';
  // เน้นตาล่าสุดของห้องที่กำลังออกอากาศ
  const st = program && states.get(program);
  const lm = st && st.game.lastMove;
  const coords = lm && !lm.pass ? [[lm.x, lm.y]] : [];
  ws.send(JSON.stringify({ t:'highlight', nameTh, nameJa, tier, coords }));
};

function render(){
  const g = $('grid'); g.innerHTML = '';
  for (const r of rooms){
    const el = document.createElement('div');
    el.className = 'tile' + (r.code === preview ? ' sel' : '') + (r.code === program ? ' live' : '');
    el.innerHTML = `
      <canvas width="200" height="200"></canvas>
      <div class="meta">
        <span><b>${r.code}</b> ${r.code === program ? '<span class="badge">LIVE</span>' : ''}</span>
        <span>${r.size}×${r.size}</span>
      </div>
      <div class="meta">
        <span>${r.black || '—'} vs ${r.white || '—'}</span><span>${T('dir.moves', { n:r.moves })}</span>
      </div>
      <div class="heat"><i style="width:${Math.max(3, r.heat)}%"></i></div>`;
    el.onclick = () => {
      preview = r.code;
      $('btnTake').disabled = false;
      syncWatch();
      render();
    };
    g.appendChild(el);
    drawMini(el.querySelector('canvas'), states.get(r.code), r.size);
  }
  paintDeck('cvProgram', 'pg', program);
  paintDeck('cvPreview', 'pv', preview);
}

function paintDeck(canvasId, prefix, code){
  const st = code && states.get(code);
  drawMini($(canvasId), st, st ? st.game.size : 9);
  $(prefix + 'Title').textContent = code ? T('live.room', { code })
    : (prefix === 'pg' ? T('dir.noRoom') : T('dir.notPicked'));
  $(prefix + 'Info').textContent = st
    ? `${st.players.black ? st.players.black.name : '—'} vs ${st.players.white ? st.players.white.name : '—'} · ${T('dir.moves', { n:st.game.moveCount })}`
    : '';
}

function drawMini(cv, st, size){
  const cx = cv.getContext('2d'), S = cv.width, N = (st ? st.game.size : size) || 9;
  const pad = S * .07, gap = (S - pad*2) / (N - 1), R = gap * .46;
  cx.fillStyle = '#DCAE5E'; cx.fillRect(0, 0, S, S);
  cx.strokeStyle = '#6B4E22'; cx.lineWidth = N > 13 ? .7 : 1;
  for (let i = 0; i < N; i++){
    const p = pad + i*gap;
    cx.beginPath(); cx.moveTo(pad,p); cx.lineTo(S-pad,p); cx.stroke();
    cx.beginPath(); cx.moveTo(p,pad); cx.lineTo(p,S-pad); cx.stroke();
  }
  if (!st) return;
  const b = st.game.board;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const v = b[y*N + x]; if (!v) continue;
    cx.beginPath(); cx.arc(pad + x*gap, pad + y*gap, R, 0, 7);
    cx.fillStyle = v === 1 ? '#1A1714' : '#F7F3E8'; cx.fill();
  }
  const lm = st.game.lastMove;
  if (lm && !lm.pass){
    cx.fillStyle = '#C2372E';
    cx.beginPath(); cx.arc(pad + lm.x*gap, pad + lm.y*gap, R*.35, 0, 7); cx.fill();
  }
}
</script>
