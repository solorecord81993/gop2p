# ตั้งค่าดีพลอยบน Render — ใช้แผน Starter เพื่อไม่ให้เครื่องหลับ
services:
  - type: web
    name: go-battle-live
    runtime: node
    plan: starter          # ห้ามใช้ free — WebSocket จะขาดทุกครั้งที่เครื่องหลับ
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DIRECTOR_TOKEN
        sync: false
      - key: AI_DELAY_MS
        value: "600"
