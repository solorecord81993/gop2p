# ตั้งค่าดีพลอยบน Render Free — Docker image ติดตั้ง KataGo CPU ให้อัตโนมัติ
services:
  - type: web
    name: go-battle-live
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DIRECTOR_TOKEN
        sync: false
      - key: AI_DELAY_MS
        value: "600"
      - key: AI_RESULT_HOLD_MS
        value: "60000"
      - key: KATAGO_MAX_VISITS
        value: "32"
      - key: KATAGO_ROOT_SYMMETRIES
        value: "1"
      - key: KATAGO_TIMEOUT_MS
        value: "120000"
      - key: KATAGO_RETRY_COOLDOWN_MS
        value: "30000"
