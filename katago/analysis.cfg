# KataGo JSON analysis engine profile for the bundled CPU service.
# It intentionally stays within a small Render instance's memory budget.

logDir = /tmp/katago-analysis-logs
logErrorsAndWarnings = true
logAllRequests = false
logAllResponses = false
logSearchInfo = false
warnUnusedFields = true

reportAnalysisWinratesAs = BLACK
analysisPVLen = 1
wideRootNoise = 0.0
maxVisits = 96

# The app sends one request for each AI turn. Two analysis workers allow two
# independent games to progress without creating a large CPU thread pool.
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 1
numEigenThreadsPerModel = 1
numNNServerThreadsPerModel = 1
nnMaxBatchSize = 2

# Keep caches modest so Node + KataGo fit on a 512 MB Render Starter service.
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 12
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
nnRandomize = false

rootSymmetryPruning = true
rootNumSymmetriesToSample = 2
useGraphSearch = true
useEvalCache = false

